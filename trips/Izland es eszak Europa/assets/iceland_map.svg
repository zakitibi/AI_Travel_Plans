    <circle cx="525" cy="412" r="8"/>
    <text x="525" y="403" font-size="10" text-anchor="middle" font-weight="700">★ Jökulsárlón</text>
    <text x="560" y="425" font-size="8" fill="#666">64.05°N, -16.18°E</text>

    <circle cx="510" cy="425" r="4"/>
    <text x="500" y="445" font-size="9" text-anchor="middle">Diamond Beach</text>
  </g>

  <!-- 6. nap: Déli part (türkiz) -->
  <g id="day6" fill="#2a8a8a">
    <circle cx="455" cy="448" r="5"/>
    <text x="455" y="468" font-size="9" text-anchor="middle">Fjaðrárgljúfur</text>

    <circle cx="380" cy="455" r="7"/>
    <text x="380" y="475" font-size="10" text-anchor="middle" font-weight="600">Vík í Mýrdal</text>
    <text x="380" y="487" font-size="8" text-anchor="middle" fill="#666">63.42°N, -19.01°E</text>

    <circle cx="365" cy="465" r="5"/>
    <text x="345" y="500" font-size="9" text-anchor="middle">Reynisfjara</text>

    <circle cx="345" cy="448" r="6"/>
    <text x="345" y="438" font-size="9" text-anchor="middle" font-weight="600">Skógafoss</text>

