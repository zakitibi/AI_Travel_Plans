  <g id="day4" fill="#a8780a">
    <circle cx="520" cy="215" r="6"/>
    <text x="520" y="207" font-size="10" text-anchor="middle" font-weight="600">Dettifoss</text>
    <text x="555" y="220" font-size="8" fill="#666">65.81°N, -16.39°E</text>

    <circle cx="555" cy="248" r="5"/>
    <text x="562" y="248" font-size="9">Stuðlagil</text>

    <circle cx="595" cy="278" r="7"/>
    <text x="608" y="278" font-size="10" font-weight="600">Egilsstaðir</text>
    <text x="608" y="290" font-size="8" fill="#666">65.27°N, -14.39°E</text>

    <circle cx="635" cy="270" r="5"/>
    <text x="645" y="270" font-size="9">Seyðisfjörður</text>
  </g>

  <!-- 5. nap: Vestrahorn, Jökulsárlón (pink) -->
  <g id="day5" fill="#aa0066">
    <circle cx="595" cy="370" r="7"/>
