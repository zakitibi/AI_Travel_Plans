    <text x="295" y="395" font-size="9">Friðheimar (paradicsom)</text>

    <circle cx="262" cy="378" r="6"/>
    <text x="252" y="378" font-size="9" text-anchor="end" font-weight="600">Geysir</text>

    <circle cx="278" cy="365" r="6"/>
    <text x="290" y="363" font-size="9" font-weight="600">Gullfoss</text>
    <text x="290" y="375" font-size="8" fill="#666">64.33°N, -20.12°E</text>

    <circle cx="220" cy="390" r="6"/>
    <text x="218" y="382" font-size="9" text-anchor="end" font-weight="600">Þingvellir</text>
  </g>

  <!-- Iránynyilak (óramutató irányban) -->
  <g fill="#444" opacity="0.7">
    <polygon points="220,335 213,330 213,340"/>
    <polygon points="320,225 314,220 318,232"/>
    <polygon points="450,222 444,218 444,226"/>
    <polygon points="580,272 575,267 577,278"/>
    <polygon points="617,335 621,329 623,341"/>
    <polygon points="475,448 481,444 481,452"/>
    <polygon points="245,418 251,414 251,422"/>
  </g>

  <!-- ============================================
       Jelmagyarázat
       ============================================ -->
  <g id="legend" transform="translate(15, 510)">
