  <!-- ============================================
       Helyszín pontok
       ============================================ -->

  <!-- 0-1. nap: Reykjavík -->
  <g id="day0-1" fill="#1a5c2a">
    <circle cx="115" cy="430" r="6"/>
    <text x="115" y="453" font-size="10" text-anchor="middle" font-weight="600">KEF reptér</text>
    <text x="115" y="465" font-size="8" text-anchor="middle" fill="#666">63.985°N, -22.605°E</text>

    <circle cx="138" cy="426" r="5"/>
    <text x="158" y="425" font-size="9">Kék Lagúna</text>

    <circle cx="195" cy="405" r="8"/>
    <text x="200" y="402" font-size="11" font-weight="700">★ Reykjavík</text>
    <text x="200" y="414" font-size="8" fill="#666">64.146°N, -21.942°E</text>
  </g>

  <!-- 2. nap: Snæfellsnes (bordó) -->
  <g id="day2" fill="#6c2a1a">
    <circle cx="160" cy="345" r="5"/>
    <text x="160" y="362" font-size="9" text-anchor="middle">Búðakirkja</text>

    <circle cx="105" cy="343" r="5"/>
    <text x="98" y="365" font-size="9" text-anchor="middle">Snæfellsjökull</text>

    <circle cx="135" cy="338" r="6"/>
    <text x="135" y="327" font-size="10" text-anchor="middle" font-weight="600">Kirkjufell</text>
    <text x="78" y="332" font-size="8" fill="#666">64.94°N,</text>
    <text x="78" y="343" font-size="8" fill="#666">-23.31°E</text>
  </g>

  <!-- 3. nap: Akureyri, Mývatn (sötétkék) -->
  <g id="day3" fill="#1a2a6c">
    <circle cx="395" cy="218" r="8"/>
    <text x="395" y="208" font-size="11" text-anchor="middle" font-weight="700">★ Akureyri</text>
    <text x="350" y="220" font-size="8" fill="#666" text-anchor="end">65.685°N,</text>
    <text x="350" y="231" font-size="8" fill="#666" text-anchor="end">-18.087°E</text>

    <circle cx="435" cy="222" r="5"/>
    <text x="442" y="220" font-size="9">Goðafoss</text>

    <circle cx="465" cy="195" r="5"/>
    <text x="475" y="195" font-size="9">Húsavík (bálnales)</text>

    <circle cx="478" cy="245" r="7"/>
