    <circle cx="0" cy="0" r="22" fill="#fff" stroke="#666" stroke-width="1"/>
    <polygon points="0,-18 4,0 0,-3 -4,0" fill="#cc3333"/>
    <polygon points="0,18 4,0 0,3 -4,0" fill="#666"/>
    <text x="0" y="-25" font-size="10" text-anchor="middle" fill="#222" font-weight="700">É</text>
    <text x="0" y="35" font-size="10" text-anchor="middle" fill="#222">D</text>
    <text x="-30" y="3" font-size="10" text-anchor="middle" fill="#222">Ny</text>
    <text x="30" y="3" font-size="10" text-anchor="middle" fill="#222">K</text>
  </g>

  <!-- Skála -->
  <g id="scale" transform="translate(620, 595)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#222" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#222" stroke-width="2"/>
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#222" stroke-width="1"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#222" stroke-width="2"/>
    <text x="0" y="16" font-size="9" fill="#222">0</text>
    <text x="60" y="16" font-size="9" text-anchor="middle" fill="#222">50 km</text>
    <text x="120" y="16" font-size="9" text-anchor="middle" fill="#222">100 km</text>
  </g>

  <!-- Megjegyzés -->
  <text x="450" y="650" font-size="9" text-anchor="middle" fill="#666" font-style="italic">
    Sematikus ábrázolás · A koordináták valós GPS pozíciók · Útvonal: ~2100 km Ring Road, óramutató járásával megegyező irány
  </text>
</svg>
