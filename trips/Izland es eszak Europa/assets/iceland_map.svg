    <text x="10" y="18" font-size="12" font-weight="700" fill="#222">Napi etapok</text>

    <circle cx="18" cy="35" r="5" fill="#1a5c2a"/>
    <text x="30" y="38" font-size="10" fill="#222">0—1. nap · Reykjavík + Kék/Sky Lagúna</text>

    <circle cx="18" cy="50" r="5" fill="#6c2a1a"/>
    <text x="30" y="53" font-size="10" fill="#222">2. nap · Snæfellsnes-félsziget (~450 km)</text>

    <circle cx="18" cy="65" r="5" fill="#1a2a6c"/>
    <text x="30" y="68" font-size="10" fill="#222">3. nap · Akureyri, Goðafoss, Mývatn</text>

    <circle cx="18" cy="80" r="5" fill="#a8780a"/>
    <text x="30" y="83" font-size="10" fill="#222">4. nap · Dettifoss, Stuðlagil, Kelet</text>

    <circle cx="18" cy="95" r="5" fill="#aa0066"/>
    <text x="30" y="98" font-size="10" fill="#222">5. nap · Vestrahorn, Jökulsárlón</text>

    <circle cx="18" cy="110" r="5" fill="#2a8a8a"/>
    <text x="30" y="113" font-size="10" fill="#222">6. nap · Déli part (Vík, vízesések)</text>

    <circle cx="210" cy="110" r="5" fill="#8a5a2a"/>
    <text x="222" y="113" font-size="10" fill="#222">7. nap · Arany-kör</text>
  </g>

