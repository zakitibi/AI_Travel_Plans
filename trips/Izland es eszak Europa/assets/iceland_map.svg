<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="system-ui, -apple-system, sans-serif">
  <!-- ============================================
       Izland 7 napos roadtrip térkép
       2026.07.18 - 07.26
       ============================================ -->

  <rect width="900" height="660" fill="#eaf2f8"/>

  <!-- Cím sáv -->
  <rect x="0" y="0" width="900" height="50" fill="#1a3a5c"/>
  <text x="20" y="32" fill="#fff" font-size="20" font-weight="600">Izland · 7 napos roadtrip · 2026.07.18 — 07.26</text>
  <text x="880" y="32" fill="#c8e0f4" font-size="13" text-anchor="end">Ring Road · ~2100 km · Reykjavík → Keflavík</text>

  <!-- Izland egyszerűsített kontúr -->
  <g id="iceland-outline">
    <!-- Fő szárazföld -->
    <path d="
      M 195 380
      L 165 360 L 145 335 L 130 310 L 125 285 L 140 260 L 165 240
      L 195 225 L 230 215 L 270 205 L 320 195 L 365 185 L 410 178
      L 460 175 L 510 178 L 555 185 L 600 195 L 645 210 L 685 225
      L 720 240 L 745 260 L 765 285 L 770 315 L 758 345 L 740 372
      L 720 395 L 695 415 L 665 432 L 630 445 L 590 455 L 545 462
      L 500 465 L 455 462 L 410 458 L 365 452 L 320 445 L 280 435
      L 245 420 L 218 402 L 200 388
      Z"
      fill="#d4e4d4" stroke="#7a9c7a" stroke-width="1.5"/>

    <!-- Westfjords (északnyugat) -->
    <path d="M 195 225 L 175 195 L 145 175 L 115 165 L 90 175 L 105 200 L 95 215 L 75 220 L 85 240 L 115 245 L 140 250 L 165 240 Z"
      fill="#d4e4d4" stroke="#7a9c7a" stroke-width="1.5" opacity="0.6"/>
    <text x="125" y="205" font-size="9" fill="#7a9c7a" font-style="italic" text-anchor="middle">Westfjords</text>
    <text x="125" y="217" font-size="8" fill="#a0b8a0" font-style="italic" text-anchor="middle">(nem érintve)</text>

    <!-- Snæfellsnes-félsziget -->
    <path d="M 200 320 L 165 315 L 130 318 L 105 325 L 85 335 L 75 345 L 90 350 L 120 348 L 150 345 L 180 340 L 200 335 Z"
      fill="#d4e4d4" stroke="#7a9c7a" stroke-width="1.5"/>

    <!-- Reykjanes-félsziget -->
    <path d="M 195 405 L 165 415 L 135 422 L 110 430 L 95 440 L 110 448 L 140 445 L 170 438 L 195 425 Z"
      fill="#d4e4d4" stroke="#7a9c7a" stroke-width="1.5"/>

    <!-- Vatnajökull gleccser -->
    <path d="M 480 340 L 520 335 L 565 340 L 600 355 L 620 380 L 605 405 L 570 415 L 530 412 L 495 400 L 475 380 L 470 360 Z"
      fill="#f5f9fc" stroke="#a8c8d8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="540" y="378" fill="#5a7a8a" font-size="10" font-style="italic" text-anchor="middle">Vatnajökull</text>

    <!-- Hofsjökull -->
    <ellipse cx="395" cy="295" rx="32" ry="22" fill="#f5f9fc" stroke="#a8c8d8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="395" y="298" fill="#5a7a8a" font-size="9" font-style="italic" text-anchor="middle">Hofsjökull</text>

    <!-- Langjökull -->
    <ellipse cx="305" cy="340" rx="28" ry="35" fill="#f5f9fc" stroke="#a8c8d8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="305" y="342" fill="#5a7a8a" font-size="9" font-style="italic" text-anchor="middle">Langjökull</text>

    <!-- Mýrdalsjökull -->
    <ellipse cx="365" cy="410" rx="30" ry="20" fill="#f5f9fc" stroke="#a8c8d8" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="365" y="413" fill="#5a7a8a" font-size="9" font-style="italic" text-anchor="middle">Mýrdalsjökull</text>
  </g>

