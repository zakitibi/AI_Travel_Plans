<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌋 Izland es eszak Europa · 2026</title>
  <link rel="stylesheet" href="./styles.css">
  <!-- Map engine CSS — travel-map-wrap, map-filter-wrap, dm-filter-sidebar, tm-marker stb. -->
  <link rel="stylesheet" href="../../engine/map.css">
  <!-- Leaflet 1.9.4 — jsDelivr (gyorsabb, megbízható SRI) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet.markercluster 1.5.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-top">
        <div class="hero-copy">
          <h1 id="hero-title"></h1>
          <p id="hero-subtitle"></p>
        </div>
        <div class="ticket-groups" id="ticket-groups"></div>
      </div>
      <div class="route" id="route"></div>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <main id="views"></main>
  </div>

  <script src="./trip-data.js"></script>
  <script>
    const tabs = [
      { id: "overview", label: "Áttekintés" },
      { id: "tibi", label: "Tibi" },
      { id: "henni", label: "Henni" },
      { id: "baltikum", label: "Baltikum" },
      { id: "izland2", label: "Izland" },
      { id: "hazaut", label: "Hazaút" },
      { id: "restaurants", label: "Gasztronómia" },
      { id: "practical", label: "🧳 Praktikus" },
      { id: "weather", label: "🌦 Időjárás" },
      { id: "terkep", label: "🗺 Térkép" },
      { id: "info", label: "Info" },
      { id: "apps", label: "📱 App" },
      { id: "budget", label: "💶 Költségvetés" }
    ];

    const heroTitle = document.getElementById("hero-title");
    const heroSubtitle = document.getElementById("hero-subtitle");
    const ticketGroups = document.getElementById("ticket-groups");
    const route = document.getElementById("route");
    const tabsEl = document.getElementById("tabs");
    const views = document.getElementById("views");

    heroTitle.textContent = tripData.title;
    heroSubtitle.textContent = `${tripData.subtitle} · Frissítve: ${tripData.updatedAt}`;

    tripData.ticketGroups.forEach((group) => {
      const card = document.createElement("details");
      card.className = "ticket-group";
      card.open = false;
      card.innerHTML = `
        <summary class="ticket-group-summary">
          <div class="ticket-group-head">
            <div>
              <h3>${group.person} <span class="ticket-person-note">(${group.summary})</span></h3>
            </div>
          </div>
          <span class="ticket-group-icon" aria-hidden="true">▾</span>
        </summary>
        <div class="ticket-group-body">
          <div class="ticket-group-grid">
            ${group.items.map((item) => `
              <article class="ticket-card">
                <div class="ticket-card-top">
                  <span class="ticket-badge">${item.mode}</span>
                  <span class="ticket-status">${item.status}</span>
                </div>
                <strong>${item.operator} · ${item.code}</strong>
                ${item.bookingRef ? `<div class="ticket-pnr">Foglalási kód: <span class="pnr-code">${item.bookingRef}</span></div>` : ""}
                <div class="ticket-route">${item.route}</div>
                <div class="ticket-meta">Indulás: ${item.departure} helyi idő</div>
                <div class="ticket-meta">Érkezés: ${item.arrival} helyi idő <span class="ticket-duration">(${item.duration})</span></div>
                ${item.bookingCom ? `<div class="ticket-meta ticket-meta-sm">Booking.com: ${item.bookingCom}</div>` : ""}
                ${item.baggage ? `<div class="ticket-meta ticket-meta-sm">🧳 ${item.baggage}</div>` : ""}
                ${item.links && item.links.length ? `<div class="ticket-links">${item.links.map((link) => `<a href="${link.url}" target="_blank" rel="noreferrer">${link.label}</a>`).join(" · ")}</div>` : ""}
              </article>
            `).join("")}
          </div>
          ${group.note ? `<div class="flight-note">${group.note}</div>` : ""}
        </div>
      `;
      ticketGroups.appendChild(card);
    });

    tripData.route.forEach((item) => {
      const node = document.createElement("span");
      if (item.separator) {
        node.className = "route-sep";
        node.innerHTML = item.separator
          .replaceAll("→", '<span class="sep-arrow">→</span>')
          .replaceAll("✈", '<span class="sep-icon">✈</span>')
          .replaceAll("🚗", '<span class="sep-icon">🚗</span>')
          .replaceAll("🚢", '<span class="sep-icon">🚢</span>');
      } else {
        node.className = `route-stop ${item.cls}`;
        node.textContent = item.label;
      }
      route.appendChild(node);
    });

    function renderLinkList(links, cls = "source-chip") {
      return (links || []).map((link) => `
        <a class="${cls}" href="${link.url}" target="_blank" rel="noreferrer">${link.label}</a>
      `).join("");
    }

    function detailsOpenAttr(isOpen, forceClosed = false) {
      return !forceClosed && isOpen ? "open" : "";
    }

    function renderDriveTimeline(points) {
      if (!points || points.length < 2) return "";

      function pct(timeStr) {
        const m = timeStr.match(/(\d{1,2}):(\d{2})/);
        if (!m) return null;
        return ((parseInt(m[1]) + parseInt(m[2]) / 60) / 24) * 100;
      }

      const ticks = [
        { p: 25, label: "06:00" },
        { p: 50, label: "12:00" },
        { p: 75, label: "18:00" }
      ];

      const ticksHtml = ticks.map((t) => `
        <div class="dtl-tick" style="left:${t.p}%"></div>
        <div class="dtl-tick-label" style="left:${t.p}%">${t.label}</div>
      `).join("");

      const dotsHtml = points.map((pt, i) => {
        const p = pct(pt.time);
        const left = p !== null ? p : (i / (points.length - 1)) * 100;
        const cls = i === 0 ? "dtl-point dtl-start" : i === points.length - 1 ? "dtl-point dtl-end" : "dtl-point";
        const xform = left < 12 ? "translateX(0)" : left > 88 ? "translateX(-100%)" : "translateX(-50%)";
        const align = left < 12 ? "flex-start" : left > 88 ? "flex-end" : "center";
        return `
          <div class="${cls}" style="left:${left.toFixed(1)}%;transform:${xform};align-items:${align}">
            <div class="dtl-dot"></div>
            <div class="dtl-time">${pt.time}</div>
            <div class="dtl-label">${pt.label}</div>
          </div>
        `;
      }).join("");

      return `
        <div class="drive-timeline">
          <div class="drive-timeline-rail"></div>
          ${ticksHtml}
          ${dotsHtml}
        </div>
      `;
    }

    function renderOverviewMap() {
      const lines = tripData.map.paths.map((path) => {
        const from = tripData.map.nodes.find((node) => node.id === path.from);
        const to = tripData.map.nodes.find((node) => node.id === path.to);
        return `
          <line
            x1="${from.x}"
            y1="${from.y}"
            x2="${to.x}"
            y2="${to.y}"
            stroke="${path.color}"
            stroke-width="${path.width || 4}"
            stroke-linecap="round"
            ${path.dashed ? 'stroke-dasharray="7 6"' : ""}
          />
        `;
      }).join("");

      const nodes = tripData.map.nodes.map((node) => `
        <g class="map-node" onclick="activateTab('${node.tab}')">
          <circle cx="${node.x}" cy="${node.y}" r="${node.major ? 9 : 7}" fill="${node.color}" />
          <text x="${node.x + 12}" y="${node.y - 2}" class="map-label">${node.label}</text>
          ${node.note ? `<text x="${node.x + 12}" y="${node.y + 11}" class="map-note">${node.note}</text>` : ""}
        </g>
      `).join("");

      return `
        <svg class="overview-map" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Észak-Európa és Izland útvonal">
          <rect x="0" y="0" width="360" height="300" rx="18" fill="#f8f3eb"></rect>
          <text x="30" y="35" class="map-note">Atlanti-óceán</text>
          <text x="208" y="42" class="map-note">Balti-tenger</text>
          <text x="238" y="116" class="map-note">Skandinávia</text>
          ${lines}
          ${nodes}
        </svg>
      `;
    }

    function renderOverviewTimelineRow(day) {
      return `
        <article class="timeline-day-row ${day.accent}">
          <div class="timeline-day-head">
            <div class="timeline-date">${day.date}</div>
          </div>
          <h3>${day.title}</h3>
          <div class="timeline-note">${day.summary}</div>
          ${day.driveStats ? `
            <div class="timeline-drive-stats">
              ${day.driveStats.km ? `<span class="ds-chip ds-km">🚗 ${day.driveStats.km}</span>` : ""}
              ${day.driveStats.stops ? `<span class="ds-chip ds-stops">📍 ${day.driveStats.stops} megálló</span>` : ""}
              ${day.driveStats.depart ? `<span class="ds-chip ds-time">⏱ ${day.driveStats.depart} → ${day.driveStats.arrive}</span>` : ""}
              ${day.driveStats.driveTime ? `<span class="ds-chip ds-drive">🕐 ${day.driveStats.driveTime} vezetés</span>` : ""}
            </div>
            ${renderDriveTimeline(day.driveStats.timelinePoints)}
          ` : ""}
          ${day.henniBox ? `
            <div class="timeline-henni-box">
              <span class="thb-icon">${day.henniBox.icon}</span>
              <div class="thb-content">
                <div class="thb-label">${day.henniBox.label}</div>
                <div class="thb-title">${day.henniBox.title}</div>
                ${day.henniBox.detail ? `<div class="thb-detail">${day.henniBox.detail}</div>` : ""}
              </div>
            </div>
          ` : ""}
        </article>
      `;
    }

    function renderOverview() {
      const balticTimeline  = tripData.overview.timeline.filter((d) => d.phase.startsWith("Tibi"));
      const icelandTimeline = tripData.overview.timeline.filter((d) => d.phase === "Közös Izland");
      const returnTimeline  = tripData.overview.timeline.filter((d) => d.phase === "Közös hazaút");
      // Stage id used by overviewMapAPI.focusPhase()
      const PHASE_STAGE = { baltic: "baltikum", iceland: "izland", return: "hazaut" };

      function phaseGroup(id, emoji, title, sub, days, open) {
        return `
          <details class="timeline-phase-details" ${open ? "open" : ""}
            ontoggle="if(this.open && window.overviewMapAPI) window.overviewMapAPI.focusPhase('${PHASE_STAGE[id]}')">
            <summary class="timeline-phase-summary">
              <div class="timeline-phase-summary-left">
                <span class="timeline-phase-emoji">${emoji}</span>
                <div>
                  <div class="timeline-phase-title">${title}</div>
                  <div class="timeline-phase-sub">${sub}</div>
                </div>
              </div>
              <span class="timeline-phase-count">${days.length} nap</span>
              <span class="timeline-phase-chevron" aria-hidden="true">▾</span>
            </summary>
            <div class="timeline-phase-body">
              <div class="timeline-rail">
                ${days.map(renderOverviewTimelineRow).join("")}
              </div>
            </div>
          </details>`;
      }
      return `
        <section class="view is-active" data-view="overview">
          <div class="overview-grid">
            <div class="stack">
              <section class="card">
                <h2 class="section-title">📅 Napi idővonal</h2>
                <div class="timeline-group-stack">
                  ${phaseGroup("baltic",  "🗺", "Baltikum",  "júl. 10–18. · Tibi autós felvezető · Lengyelország → Észtország → Helsinki → Stockholm", balticTimeline,  true)}
                  ${phaseGroup("iceland", "🇮🇸", "Izland",    "júl. 18–26. · közös Ring Road körút · Reykjavík → Snæfellsnes → Észak → Kelet → Déli part", icelandTimeline, false)}
                  ${phaseGroup("return",  "🚗", "Hazaút",    "júl. 26. – aug. 6. · Stockholm → Koppenhága → Hamburg → Frankfurt → Budapest", returnTimeline,  false)}
                </div>
              </section>
              <details class="card section-card coll-card iz2-map-panel" open>
                <summary class="coll-card-head">
                  <span class="map-section-title" style="margin:0;">🗺 Interaktív útvonal-térkép — a teljes út</span>
                  <span class="collapse-icon" aria-hidden="true">▾</span>
                </summary>
                <p class="section-intro" style="margin-bottom:10px;">
                  A teljes út egy térképen: minden megálló a szakasz (fázis) színével, az ikon a hely jellegét mutatja, a 🏨 az éjszakai szállás.
                  Szűrj fázis vagy típus szerint — egy fázis kinyitása a napi idővonalban automatikusan arra szűr a térképen.
                </p>
                <div class="map-filter-wrap">
                  <div class="travel-map-wrap" style="height:420px;">
                    <div id="overview-map" style="width:100%;height:100%;"></div>
                    <div class="tm-overlay">
                      <div class="tm-spinner"></div>
                      <span>Térkép betöltése…</span>
                    </div>
                  </div>
                  <aside class="dm-filter-sidebar" id="overview-map-filter"></aside>
                </div>
                <div class="iz2-routestat" id="overview-routestat">Útvonal betöltése valódi úthálózaton…</div>
                <div class="iz2-legend" id="overview-legend"></div>
              </details>
            </div>
            <div class="stack">
              <section class="card">
                <h2 class="section-title">🧭 Országonként</h2>
                <div class="country-summary-stack">
                  ${tripData.overview.countrySummaries.map((country) => `
                    <article class="country-summary-box ${country.accent}">
                      <h3>${country.title}</h3>
                      <p>${country.text}</p>
                      <ul>
                        ${country.points.map((point) => `<li><strong>${point.label}:</strong> ${point.value}</li>`).join("")}
                      </ul>
                    </article>
                  `).join("")}
                </div>
              </section>
              <section class="card">
                <h2 class="section-title">🧭 Fő utazások</h2>
                <div class="summary-grid">
                  ${tripData.overview.mainTrips.map((trip) => `
                    <article class="summary-card ${trip.accent}">
                      <h3>${trip.title}</h3>
                      <p>${trip.text}</p>
                      <button class="jump-btn" type="button" onclick="activateTab('${trip.tab}')">${trip.cta}</button>
                    </article>
                  `).join("")}
                </div>
              </section>
              <section class="card">
                <h2 class="section-title">⚠️ Fontos</h2>
                <ul class="badge-list">
                  ${tripData.overview.important.map((item) => `<li><span class="badge badge-gold">FONTOS</span><strong>${item}</strong></li>`).join("")}
                </ul>
              </section>
            </div>
          </div>

        </section>
      `;
    }

    function renderStageCard(stage) {
      return `
        <article class="summary-card ${stage.accent}">
          <div class="stage-card-top">
            <h3>${stage.title}</h3>
            <span class="status-chip ${stage.statusClass}">${stage.status}</span>
          </div>
          <p>${stage.text}</p>
          <ul class="plain-list compact">
            ${stage.points.map((point) => `<li>${point}</li>`).join("")}
          </ul>
          ${stage.cta ? `<button class="jump-btn" type="button" onclick="activateTab('${stage.cta.tab}')">${stage.cta.label}</button>` : ""}
        </article>
      `;
    }

    function renderPersonView(personKey) {
      const person = tripData.people[personKey];
      const stages = person.stageKeys.map((key) => tripData.stageLibrary[key]);
      return `
        <section class="view" data-view="${personKey}">
          <div class="section-head">
            <div>
              <h2><span>${person.kicker}</span>${person.title}</h2>
            </div>
          </div>
          <div class="note-card info full-width-card">
            <p>${person.intro}</p>
          </div>
          <div class="summary-grid stage-grid">
            ${stages.map(renderStageCard).join("")}
          </div>
        </section>
      `;
    }

    function renderCountryContext(section, forceClosed = false) {
      return section.context.map((block) => `
        <details class="country-context ${block.accent}" ${detailsOpenAttr(block.open, forceClosed)}>
          <summary class="collapse-summary">
            <span>${block.title}</span>
            <span class="collapse-icon" aria-hidden="true">▾</span>
          </summary>
          <div class="country-context-body">
            <div class="context-grid">
              ${block.cards.map((card) => `
                <article class="context-card">
                  <h3>${card.title}</h3>
                  ${card.paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}
                </article>
              `).join("")}
            </div>
            ${block.links && block.links.length ? `<div class="context-sources">${renderLinkList(block.links)}</div>` : ""}
          </div>
        </details>
      `).join("");
    }

    function renderCollapseBox(block, forceClosed = false) {
      if (!block) return "";
      return `
        <details class="country-context ${block.accent}" ${detailsOpenAttr(block.open, forceClosed)}>
          <summary class="collapse-summary">
            <span>${block.title}</span>
            <span class="collapse-icon" aria-hidden="true">▾</span>
          </summary>
          <div class="country-context-body">
            ${block.cards && block.cards.length ? `
              <div class="context-grid ${block.layout === "stack" ? "context-grid-stack" : ""}">
                ${block.cards.map((card) => `
                  <article class="context-card">
                    ${card.title ? `<h3>${card.title}</h3>` : ""}
                    ${card.paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}
                  </article>
                `).join("")}
              </div>
            ` : ""}
            ${block.links && block.links.length ? `<div class="context-sources">${renderLinkList(block.links)}</div>` : ""}
          </div>
        </details>
      `;
    }

    // Egyetlen extraResource-doboz (items + links + subBoxes) — újrahasználható
    function renderExtraResourceBox(resource, accent = "iceland", forceClosed = false) {
      if (!resource) return "";
      return `
        <details class="country-context ${resource.accent || accent}" ${detailsOpenAttr(resource.open, forceClosed)}>
          <summary class="collapse-summary">
            <span>${resource.title}</span>
            <span class="collapse-icon" aria-hidden="true">▾</span>
          </summary>
          <div class="country-context-body">
            ${resource.text ? `<p class="info-text">${resource.text}</p>` : ""}
            ${resource.links && resource.links.length ? `<div class="context-sources">${renderLinkList(resource.links)}</div>` : ""}
            ${resource.items && resource.items.length ? `<ul class="plain-list compact top-gap">${resource.items.map((item) => `<li>${item}</li>`).join("")}</ul>` : ""}
            ${resource.subBoxes && resource.subBoxes.length ? resource.subBoxes.map((sub) => `
              <details class="country-context-inner ${sub.accent || resource.accent || accent}" ${detailsOpenAttr(sub.open, forceClosed)}>
                <summary class="collapse-summary">
                  <span>${sub.title}</span>
                  <span class="collapse-icon" aria-hidden="true">▾</span>
                </summary>
                <div class="country-context-body">
                  ${sub.text ? `<p class="info-text">${sub.text}</p>` : ""}
                  ${sub.links && sub.links.length ? `<div class="context-sources">${renderLinkList(sub.links)}</div>` : ""}
                  ${sub.items && sub.items.length ? `<ul class="plain-list compact top-gap">${sub.items.map((item) => `<li>${item}</li>`).join("")}</ul>` : ""}
                </div>
              </details>
            `).join("") : ""}
          </div>
        </details>
      `;
    }

    function renderDayCard(day, accentClass, forceClosed = false) {
      const timed = (day.gpxPlaces || []).map((p, idx) => ({ ...p, _idx: idx })).filter((p) => p.time).sort((a, b) => a.time.localeCompare(b.time));
      timed.forEach((p, i) => { p._gi = i; });
      const hasSchedule = timed.length > 0;
      const PERIODS = [
        { label: "Reggel", icon: "🌅", test: (t) => t < "12:00" },
        { label: "Délután", icon: "☀️", test: (t) => t >= "12:00" && t < "18:00" },
        { label: "Este", icon: "🌆", test: (t) => t >= "18:00" }
      ];
      // Két megálló közti közúti táv és becsült menetidő (haversine × 1,25 közúti szorzó, ~80 km/h Route 1).
      function legHav(a, b) {
        const R = 6371, r = (d) => (d * Math.PI) / 180;
        const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
        const s = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(s));
      }
      function legDriveTxt(mins) {
        mins = Math.round(mins / 5) * 5;
        if (mins < 60) return "~" + mins + " perc";
        const h = Math.floor(mins / 60), m = mins % 60;
        return "~" + h + " ó" + (m ? " " + m + " p" : "");
      }
      function legRow(a, b) {
        if (!a || !b || a.lat == null || b.lat == null) return "";
        const km = Math.round(legHav(a, b) * 1.25);
        if (km < 2) return ""; // azonos parkoló / pár száz méter — nem külön etap
        const mins = (km / 80) * 60;
        return `<div class="sched-row sched-leg-row"><div class="sched-time"></div><div class="sched-content"><div class="sched-leg"><span class="sched-leg-ico">🚗</span><span class="dl-chip dl-km">~${km} km</span><span class="dl-chip dl-drive">🕐 ${legDriveTxt(mins)} menet</span></div></div></div>`;
      }
      const scheduleHtml = hasSchedule ? `
        <section class="day-schedule">
          ${day.scheduleNote ? `<div class="tip-box sched-note">${day.scheduleNote}</div>` : ""}
          ${PERIODS.map((per) => {
            const items = timed.filter((p) => per.test(p.time));
            if (!items.length) return "";
            return `
              <div class="sched-period">
                <div class="sched-period-label">${per.icon} ${per.label}</div>
                ${items.map((p) => `
                  ${p._gi > 0 && !p.branch && !timed[p._gi - 1].branch ? legRow(timed[p._gi - 1], p) : ""}
                  <div class="sched-row${p.branch ? " sched-row-branch sched-branch-" + p.branch.toLowerCase() : ""}">
                    <div class="sched-time">${p.time}</div>
                    <div class="sched-content">
                      ${p.branch ? `<div class="sched-branch-tag">${p.branch === "A" ? "🅰" : "🅱"} ${p.branchLabel || "alternatíva"} · vagy</div>` : ""}
                      <div class="sched-name">${p.maps ? `<a class="day-place-name-link" href="${p.maps}" target="_blank" rel="noreferrer">${p.name}</a>` : p.name}${p.googleRating ? ` <a class="sched-rate" href="${p.maps}" target="_blank" rel="noreferrer" title="Google Maps">⭐${p.googleRating}</a>` : ""}${p.lat != null ? ` <button type="button" class="day-place-maplink sched-maplink" data-iz2-key="${day.num}-${p._idx}" title="Ugrás a saját térképre">🗺</button>` : ""}${p.duration ? ` <span class="sched-dur">⏳ ${p.duration}</span>` : ""}</div>
                      ${p.detail ? `<div class="sched-detail">${p.detail}</div>` : ""}

                    </div>

          }).join("")}

      ` : "";
      const cardsHtml = (day.gpxPlaces || []).map((place, placeIdx) => `
        <article class="day-place-card${place.lat != null ? " day-place-mapped" : ""}"${place.lat != null ? ` data-iz2-key="${day.num}-${placeIdx}"` : ""}>
          <div class="day-place-top">
            <div>
              <div class="day-place-name">${place.maps ? `<a class="day-place-name-link" href="${place.maps}" target="_blank" rel="noreferrer">${place.name}</a>` : place.name}</div>
              ${place.badge ? `<div class="day-place-badge">${place.badge}</div>` : ""}
            </div>
            <div class="day-place-actions">
              ${place.lat != null ? `<button type="button" class="day-place-maplink" title="Ugrás a térképre">🗺 térkép</button>` : ""}
              ${place.googleRating ? (place.maps ? `<a class="day-place-rating day-place-rating-link" href="${place.maps}" target="_blank" rel="noreferrer" title="Google Maps">⭐ ${place.googleRating}</a>` : `<div class="day-place-rating">⭐ ${place.googleRating}</div>`) : ""}

          </div>
          ${place.duration ? `<div class="day-place-duration">⏳ ${place.duration}</div>` : ""}
          <p class="day-place-detail">${place.detail}</p>
          ${place.reviewNote ? `<p class="day-place-review">"${place.reviewNote}"</p>` : ""}
          ${place.noteLink ? `<div class="day-place-links"><a href="${place.noteLink}" target="_blank" rel="noreferrer">${place.noteLabel || "Forrás"}</a></div>` : ""}
        </article>
      `).join("");
      // Baltikum-stílusú menetrend: activities periódusokba (reggel/délután/este) rendezve
      const hasActSchedule = !hasSchedule && (accentClass === "baltic" || accentClass === "return") && (day.activities || []).length > 0;
      function actHour(t) {
        const m = /(\d{1,2}):(\d{2})/.exec(t || "");
        if (m) return parseInt(m[1], 10);
        const map = { "kora reggel": 6, "reggel": 7, "délelőtt": 10, "napközben": 12, "délben": 12, "dél": 12, "kora délután": 13, "délután": 14, "késő délután": 16, "kora este": 18, "este": 19, "késő este": 21, "párhuzamos szál": 12 };
        return map[(t || "").toLowerCase().trim()] ?? 12;
      }
      function driveChips(txt) {
        let out = "";
        const km = /~?\s*(\d[\d\s.]*)\s*km/i.exec(txt || "");
        const dur = /~?\s*([\d][\d.,]*)\s*(óra|perc|h)\b/i.exec(txt || "");
        if (km) out += `<span class="dl-chip dl-km">🚗 ~${km[1].trim()} km</span>`;
        if (dur) out += `<span class="dl-chip dl-drive">🕐 ~${dur[1]} ${dur[2] === "h" ? "óra" : dur[2]}</span>`;
        return out;
      }
      const ACT_PERIODS = [
        { label: "Reggel", icon: "🌅", lo: 0, hi: 12 },
        { label: "Délután", icon: "☀️", lo: 12, hi: 18 },
        { label: "Este", icon: "🌆", lo: 18, hi: 24 }
      ];
      const actScheduleHtml = hasActSchedule ? `
        <section class="day-schedule">
          ${ACT_PERIODS.map((per) => {
            const items = (day.activities || []).filter((a) => { const h = actHour(a.time); return h >= per.lo && h < per.hi; });
            if (!items.length) return "";
            return `
              <div class="sched-period">
                <div class="sched-period-label">${per.icon} ${per.label}</div>
                ${items.map((a) => {
                  const isDrive = a.icon === "🚗" || a.icon === "🚢" || a.icon === "⚓";
                  // Értékelés: explicit googleRating mező, vagy a névbe ágyazott (★X) — utóbbit kiemeljük
                  // egy tiszta ⭐ chipbe (csak ha pontosan egy van, hogy a többértékelésű nevek érintetlenek maradjanak).
                  let rating = a.googleRating, nameRaw = a.name;
                  if (!rating) {
                    const found = nameRaw.match(/\(★\s*[\d.,]+\)/g) || [];
                    if (found.length === 1) { rating = found[0].replace(/[^\d.,]/g, ""); nameRaw = nameRaw.replace(/\s*\(★\s*[\d.,]+\)\s*/, " "); }
                  }
                  // Csak a név zárójeles (km, idő) annotációjából képezünk chipet — a detail prózából nem,
                  // hogy ne kerüljön be véletlen táv/idő (pl. ferry-érkezésnél a reptérig tartó perc).
                  const chips = isDrive ? driveChips(nameRaw) : "";
                  let nameClean = nameRaw.replace(/\s*\(~?\s*\d[^)]*\)\s*$/, "");
                  if (isDrive) nameClean = nameClean.replace(/\s+~?\s*\d[\d\s.]*\s*km.*$/i, "");
                  nameClean = nameClean.trim();
                  const nameHasLink = /<a[\s>]/i.test(nameClean);
                  const mapsLink = (rating && !nameHasLink) ? (a.maps || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nameClean)}`) : null;
                  const rateChip = rating ? (mapsLink ? ` <a class="sched-rate" href="${mapsLink}" target="_blank" rel="noreferrer" title="Google Maps">⭐${rating}</a>` : ` <span class="sched-rate">⭐${rating}</span>`) : "";
                  return `
                    <div class="sched-row">
                      <div class="sched-time">${a.time}</div>
                      <div class="sched-content">
                        <div class="sched-name">${a.icon ? `${a.icon} ` : ""}${mapsLink ? `<a class="day-place-name-link" href="${mapsLink}" target="_blank" rel="noreferrer">${nameClean}</a>` : nameClean}${rateChip}${a.mapName ? ` <button type="button" class="day-place-maplink sched-maplink bm-maplink" data-bm-name="${a.mapName}" title="Ugrás a saját térképre">🗺</button>` : ""}${a.duration ? ` <span class="sched-dur">⏳ ${a.duration}</span>` : ""}${chips ? ` <span class="sched-chips-inline">${chips}</span>` : ""}</div>
                        ${a.detail ? `<div class="sched-detail">${a.detail}</div>` : ""}
                        ${a.note ? `<div class="tip-box">${a.note}</div>` : ""}
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            `;
          }).join("")}
        </section>
      ` : "";
      return `
        <details class="day-card ${accentClass}" ${detailsOpenAttr(day.open, forceClosed)}>
          <summary class="day-head">
            <div class="day-num">${day.num}</div>
            <div class="day-info">
              <div class="day-date">${day.date}</div>
              <div class="day-title">${day.title}</div>
              <div class="day-sub">${day.subtitle}</div>
              <div class="day-tags">
                ${day.tags.map((tag) => `<span class="tag ${tag.cls}">${tag.label}</span>`).join("")}
              </div>
              ${day.rainNote ? `<div class="day-rain-note"><span>${day.rainNote.icon}</span><span>${day.rainNote.label}</span></div>` : ""}
              ${day.driveLog ? `
                <div class="day-drive-log">
                  ${day.driveLog.km ? `<span class="dl-chip dl-km">🚗 ${day.driveLog.km}</span>` : ""}
                  ${day.driveLog.stops ? `<span class="dl-chip dl-stops">📍 ${day.driveLog.stops} megálló</span>` : ""}
                  ${day.driveLog.driveTime ? `<span class="dl-chip dl-drive">🕐 ${day.driveLog.driveTime} vezetés</span>` : ""}
                  ${day.driveLog.depart ? `<span class="dl-chip dl-time">⏱ ind. ${day.driveLog.depart} · erk. ${day.driveLog.arrive}</span>` : ""}
                </div>
                ${renderDriveTimeline(day.driveLog.timelinePoints)}
              ` : ""}
            </div>
            <div class="chevron">▾</div>
          </summary>
          <div class="day-body">
            ${day.character ? `<p class="day-character">${day.character}</p>` : ""}
            ${hasSchedule ? scheduleHtml : (hasActSchedule ? actScheduleHtml : `
            <div class="day-layout">
              <div class="activities">
                ${(day.activities || []).map((activity) => `
                  <div class="act">
                    <div class="act-time">${activity.time}</div>
                    <div class="act-icon">${activity.icon}</div>
                    <div>
                      <div class="act-name">${activity.name}</div>
                      <div class="act-detail">${activity.detail}</div>
                      ${activity.note ? `<div class="tip-box">${activity.note}</div>` : ""}
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>`)}
            ${day.notes && day.notes.length ? `
              <aside class="tip-box day-focus-box day-focus-horizontal">
                <strong>Napi fókusz</strong>
                <ul class="plain-list compact focus-grid">
                  ${day.notes.map((note) => `<li>${note}</li>`).join("")}
                </ul>
              </aside>
            ` : ""}
            ${day.gpxPlaces && day.gpxPlaces.length ? (hasSchedule ? `
              <details class="country-context ${accentClass} day-places-collapse">
                <summary class="collapse-summary">
                  <span>📍 Látnivalók részletei — térkép, értékelés, review (${day.gpxPlaces.length})</span>
                  <span class="collapse-icon" aria-hidden="true">▾</span>

                <div class="country-context-body">
                  <div class="day-places-grid">${cardsHtml}</div>

                <h4 class="day-places-title">🔗 Napi linkek</h4>
                <div class="context-sources">
                  ${renderLinkList(day.links)}
                </div>
              </section>
            ` : ""}
          </div>
        </details>
      `;
    }

    const PAGE_STATE_KEY = "izland-es-eszak-europa:view-state";
    const tabsMarkup = [
      renderOverview(),
      renderPersonView("tibi"),
      renderPersonView("henni"),
      renderBaltikum2(),

      renderRestaurants(),
      renderPractical(),

      renderMap(),
      renderInfo(),
      renderApps(),
      renderBudget()
    ].join("");

    function readPageState() {
      try {
        return JSON.parse(sessionStorage.getItem(PAGE_STATE_KEY) || "{}");
      } catch (_) {
        return {};
      }
    }

    function writePageState(nextState) {
      try {
        const prev = readPageState();
        sessionStorage.setItem(PAGE_STATE_KEY, JSON.stringify({ ...prev, ...nextState }));
      } catch (_) {}
    }

    function getInitialTabId() {
      const hashTab = (window.location.hash || "").replace(/^#/, "");
      if (tabs.some((tab) => tab.id === hashTab)) return hashTab;
      const savedTab = readPageState().activeTab;
      if (tabs.some((tab) => tab.id === savedTab)) return savedTab;
      return tabs[0].id;
    }

    views.innerHTML = tabsMarkup;

    const initialTabId = getInitialTabId();
    tabsEl.innerHTML = tabs.map((tab, index) => `
      <button class="tab-btn ${tab.id === initialTabId ? "is-active" : ""}" data-tab="${tab.id}">${tab.label}</button>
    `).join("");

    const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));
    const viewEls = Array.from(document.querySelectorAll(".view"));
    let activeTabId = initialTabId;

    function activateTab(id) {
      activeTabId = id;
      tabButtons.forEach((button) => button.classList.toggle("is-active", button.dataset.tab === id));
      viewEls.forEach((view) => view.classList.toggle("is-active", view.dataset.view === id));
      writePageState({ activeTab: id });
      const nextHash = `#${id}`;
      if (window.location.hash !== nextHash) {
        history.replaceState(null, "", nextHash);
      }
    }

    window.activateTab = activateTab;
    activateTab(initialTabId);

    tabsEl.addEventListener("click", (event) => {
      const button = event.target.closest(".tab-btn");
      if (!button) return;
      activateTab(button.dataset.tab);
    });

    function saveScrollState() {
      writePageState({ activeTab: activeTabId, scrollY: window.scrollY });
    }

    window.addEventListener("scroll", saveScrollState, { passive: true });
    window.addEventListener("pagehide", saveScrollState);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") saveScrollState();
    });

    const savedScrollY = Number(readPageState().scrollY);
    if (Number.isFinite(savedScrollY) && savedScrollY > 0) {
      requestAnimationFrame(() => {
        window.scrollTo({ top: savedScrollY, left: 0, behavior: "auto" });
      });
    }

    // Leaflet invalidateSize when a collapsible map card is re-opened
    document.addEventListener("toggle", (e) => {
      if (!e.target.open || !window._leafletMaps) return;
      requestAnimationFrame(() => {
        for (const m of Object.values(window._leafletMaps)) {
          try { m.invalidateSize(); } catch(_) {}
        }
      });
    }, true);
  </script>

  <!-- Izland — interaktív Ring Road térkép (típus-ikonok + OSRM valós útvonal + szűrő + reset) -->
  <script>
    (function () {
      const sec = (window.tripData || (typeof tripData !== "undefined" ? tripData : null))?.sections?.izland2;
      if (!sec) return;
      let inited = false;

      // Látnivaló-jelleg → ikon + címke
      const KIND = {
        park:       { emoji: "🏞️", label: "Nemzeti park" },
        waterfall:  { emoji: "💧", label: "Vízesés" },
        geothermal: { emoji: "♨️", label: "Geotermikus / gejzír" },
        bath:       { emoji: "🛁", label: "Fürdő / lagúna" },
        glacier:    { emoji: "🧊", label: "Gleccser / jég" },
        beach:      { emoji: "🏖️", label: "Fekete strand" },
        photo:      { emoji: "📸", label: "Fotópont / szikla" },
        town:       { emoji: "🏙️", label: "Város / falu" },
        stay:       { emoji: "🏨", label: "Szállás (éjszaka)" }
      };
      const kindOf = (k) => KIND[k] || { emoji: "📍", label: "Egyéb" };

      // "2026. július 18., szombat" → "7.18"
      const HU_MONTH = { január: 1, február: 2, március: 3, április: 4, május: 5, június: 6, július: 7, augusztus: 8, szeptember: 9, október: 10, november: 11, december: 12 };
      function shortDate(dstr) {
        const m = /([A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüű]+)\s+(\d{1,2})\./.exec(dstr || "");
        if (!m) return "";
        const mon = HU_MONTH[m[1].toLowerCase()];
        return mon ? `${mon}.${m[2]}` : "";
      }

      function init() {
        if (inited) return;
        const L = window.L;
        const el = document.getElementById("izland2-map");
        if (!L || !el) return;
        inited = true;

        const wrap = el.closest(".travel-map-wrap");
        const overlay = wrap && wrap.querySelector(".tm-overlay");

        const map = L.map("izland2-map", { scrollWheelZoom: false }).setView([64.9, -18.6], 6);
        window._leafletMaps = window._leafletMaps || {};
        window._leafletMaps["izland2-map"] = map;

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxZoom: 19
        }).addTo(map);

        const ordered = [], markerList = [], markers = {}, bounds = [];
        sec.days.forEach((d) => {
          (d.gpxPlaces || []).forEach((s, si) => {
            if (s.lat == null || s.lng == null) return;
            ordered.push(s);
            bounds.push([s.lat, s.lng]);
            const ov = s.t === "ov" || s.kind === "stay";
            const kc = kindOf(s.kind);
            const size = ov ? 32 : 28;
            const color = d.mapColor || "#1f5a3e";
            const icon = L.divIcon({
              className: "",
              html: `<div class="iz2-pin${ov ? " iz2-pin-ov" : ""}${s.puffin ? " iz2-pin-puffin" : ""}" style="--c:${color};width:${size}px;height:${size}px"><span>${ov ? "🏨" : kc.emoji}</span>${s.puffin ? '<span class="iz2-puffin-badge">🐦</span>' : ""}</div>`,
              iconSize: [size, size],
              iconAnchor: [size / 2, size / 2],
              popupAnchor: [0, -size / 2]
            });
            const m = L.marker([s.lat, s.lng], { icon, riseOnHover: true }).addTo(map);
            m.bindPopup(`<div class="iz2-pp"><div class="iz2-pp-t">${s.name}</div><div class="iz2-pp-d">${d.num}. nap · ${d.date.replace("2026. ", "")} · ${kc.emoji} ${kc.label}</div><div class="iz2-pp-n">${s.detail || ""}</div></div>`);
            // Szállás-pontoknál a hely neve állandó címkeként a térképen
            if (ov) {
              m.bindTooltip(s.name.split(" / ")[0], {
                permanent: true,
                direction: "top",
                offset: [0, -(size / 2)],
                className: "iz2-stay-label"
              });
            }
            markers[`${d.num}-${si}`] = m;
            markerList.push({ marker: m, dayNum: d.num, kind: s.kind || "other", puffin: !!s.puffin });
          });
        });
        const initialBounds = bounds.length ? L.latLngBounds(bounds) : null;
        if (initialBounds) map.fitBounds(initialBounds, { padding: [40, 40] });

        // Tartalék szaggatott légvonal, amíg / ha nincs valódi útvonal
        let fallback = L.polyline(ordered.map((s) => [s.lat, s.lng]), { color: "#1f5a3e", weight: 2, opacity: 0.35, dashArray: "6 8" }).addTo(map);

        // Valódi úthálózaton futó nyomvonal (OSRM, kulcs nélkül)
        const coordStr = ordered.map((s) => `${s.lng},${s.lat}`).join(";");
        fetch(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`)
          .then((r) => r.json())
          .then((d) => {
            if (d && d.routes && d.routes[0]) {
              if (fallback) { map.removeLayer(fallback); fallback = null; }
              L.geoJSON(d.routes[0].geometry, { style: { color: "#1f5a3e", weight: 3, opacity: 0.7 } }).addTo(map);
              const km = Math.round(d.routes[0].distance / 1000);
              const rs = document.getElementById("izland2-routestat");
              if (rs) rs.textContent = `Valódi úthálózaton: kb. ${km} km a teljes kör (Route 1 + kitérők).`;
            } else { throw 0; }
          })
          .catch(() => {
            const rs = document.getElementById("izland2-routestat");
            if (rs) rs.textContent = "A vonal tájékoztató (légvonal a megállók közt) — a valódi útvonal-lekérés most nem érhető el.";
          });

        // ── Reset / kiindulópont gomb (saroknban) ──────────────────────────
        const ResetCtl = L.Control.extend({
          options: { position: "topright" },
          onAdd() {
            const b = L.DomUtil.create("button", "iz2-reset-btn");
            b.type = "button";
            b.title = "Vissza a teljes nézetre";
            b.setAttribute("aria-label", "Vissza a teljes nézetre");
            b.innerHTML = "⤢";
            L.DomEvent.disableClickPropagation(b);
            L.DomEvent.on(b, "click", (e) => {
              L.DomEvent.stop(e);
              if (initialBounds) map.fitBounds(initialBounds, { padding: [40, 40] });
            });
            return b;
          }
        });
        map.addControl(new ResetCtl());

        // ── Szűrő-sidebar (Napok + Típus) ──────────────────────────────────
        const sidebar = document.getElementById("izland2-map-filter");
        if (sidebar && !sidebar.childElementCount) {
          const presentKinds = [];
          for (const k of Object.keys(KIND)) {
            if (markerList.some((m) => m.kind === k)) presentKinds.push(k);
          }
          const state = {
            days: new Set(sec.days.map((d) => d.num)),
            kinds: new Set(presentKinds),
            onlyPuffin: false
          };

          function applyFilter() {
            for (const item of markerList) {
              const vis = state.days.has(item.dayNum)
                       && state.kinds.has(item.kind)
                       && (!state.onlyPuffin || item.puffin);
              if (vis) { if (!map.hasLayer(item.marker)) map.addLayer(item.marker); }
              else { if (map.hasLayer(item.marker)) map.removeLayer(item.marker); }
            }
          }

          function makeSection(title, items, stateKey, scrollable) {
            const sec2 = document.createElement("div");
            sec2.className = "dm-filter-section";
            const head = document.createElement("div");
            head.className = "dm-filter-section-head";
            const ttl = document.createElement("strong");
            ttl.textContent = title;
            const acts = document.createElement("span");
            acts.className = "dm-filter-actions";
            const allB = document.createElement("button");
            allB.className = "dm-btn-all"; allB.type = "button"; allB.textContent = "Mind";
            const noneB = document.createElement("button");
            noneB.className = "dm-btn-none"; noneB.type = "button"; noneB.textContent = "Egyik sem";
            acts.append(allB, noneB);
            head.append(ttl, acts);
            sec2.appendChild(head);
            const body = document.createElement("div");
            body.className = "dm-filter-section-body" + (scrollable ? " dm-filter-scrollable" : "");
            const cbs = [];
            for (const item of items) {
              const lbl = document.createElement("label");
              lbl.className = "dm-filter-row";
              const cb = document.createElement("input");
              cb.type = "checkbox";
              cb.checked = state[stateKey].has(item.id);
              cb.addEventListener("change", () => {
                if (cb.checked) state[stateKey].add(item.id);
                else state[stateKey].delete(item.id);
                applyFilter();
              });
              cbs.push(cb);
              const span = document.createElement("span");
              span.className = "dm-filter-label";
              if (item.dotColor) {
                const dot = document.createElement("span");
                dot.className = "dm-dot";
                dot.style.background = item.dotColor;
                span.appendChild(dot);
              }
              span.appendChild(document.createTextNode(item.label));
              lbl.append(cb, span);
              body.appendChild(lbl);
            }
            allB.addEventListener("click", () => { items.forEach((i) => state[stateKey].add(i.id)); cbs.forEach((c) => c.checked = true); applyFilter(); });
            noneB.addEventListener("click", () => { state[stateKey].clear(); cbs.forEach((c) => c.checked = false); applyFilter(); });
            sec2.appendChild(body);
            return sec2;
          }

          const header = document.createElement("div");
          header.className = "dm-sidebar-header";
          header.textContent = "Szűrők";
          sidebar.appendChild(header);

          sidebar.appendChild(makeSection(
            "Napok",
            sec.days.map((d) => ({ id: d.num, label: `${shortDate(d.date)} · ${d.title}`, dotColor: d.mapColor })),
            "days", true
          ));
          const hr = document.createElement("hr");
          hr.className = "dm-filter-divider";
          sidebar.appendChild(hr);
          sidebar.appendChild(makeSection(
            "Típus",
            presentKinds.map((k) => ({ id: k, label: `${kindOf(k).emoji} ${kindOf(k).label}` })),
            "kinds", false
          ));

          // ── 🐦 Lundák — külön szűrő (csak a puffin-helyek) ────────────────
          if (markerList.some((m) => m.puffin)) {
            const hr2 = document.createElement("hr");
            hr2.className = "dm-filter-divider";
            sidebar.appendChild(hr2);
            const sec3 = document.createElement("div");
            sec3.className = "dm-filter-section";
            const head3 = document.createElement("div");
            head3.className = "dm-filter-section-head";
            const ttl3 = document.createElement("strong");
            ttl3.textContent = "🐦 Lundák";
            head3.appendChild(ttl3);
            sec3.appendChild(head3);
            const body3 = document.createElement("div");
            body3.className = "dm-filter-section-body";
            const lbl3 = document.createElement("label");
            lbl3.className = "dm-filter-row";
            const cb3 = document.createElement("input");
            cb3.type = "checkbox";
            cb3.checked = false;
            cb3.addEventListener("change", () => { state.onlyPuffin = cb3.checked; applyFilter(); });
            const span3 = document.createElement("span");
            span3.className = "dm-filter-label";
            span3.appendChild(document.createTextNode("Csak a lundás helyek"));
            lbl3.append(cb3, span3);
            body3.appendChild(lbl3);
            sec3.appendChild(body3);
            sidebar.appendChild(sec3);
          }
        }

        // Jelmagyarázat (napszínek + szállás ikon)
        const leg = document.getElementById("izland2-legend");
        if (leg && !leg.childElementCount) {
          sec.days.forEach((d) => {
            const sp = document.createElement("span");
            sp.innerHTML = `<span class="iz2-dot" style="background:${d.mapColor}"></span>${shortDate(d.date)} · ${d.title}`;
            leg.appendChild(sp);
          });
          const ov = document.createElement("span");
          ov.innerHTML = `<span class="iz2-leg-stay">🏨</span>Éjszakai szállás`;
          leg.appendChild(ov);
          if (markerList.some((m) => m.puffin)) {
            const pf = document.createElement("span");
            pf.innerHTML = `<span class="iz2-leg-stay">🐦</span>Lundás hely`;
            leg.appendChild(pf);
          }
        }

        // Kattintás a napi kártya "🗺 térkép" gombjára → a térkép odarepül
        const mapPanel = el.closest("details.iz2-map-panel");
        document.querySelectorAll('.view[data-view="izland2"] .day-place-maplink').forEach((link) => {
          link.addEventListener("click", (ev) => {
            ev.preventDefault();
            const card = link.closest("[data-iz2-key]");
            if (!card) return;
            const m = markers[card.getAttribute("data-iz2-key")];
            if (!m) return;
            // 1) a térkép-panel legyen nyitva, hogy látszódjon
            if (mapPanel && !mapPanel.open) mapPanel.open = true;
            // 2) görgessünk a térképre
            (mapPanel || wrap || el).scrollIntoView({ behavior: "smooth", block: "start" });
            // 3) layout-tick után méret-frissítés + repülés a markerhez
            setTimeout(() => {
              try { map.invalidateSize(); } catch (_) {}
              if (!map.hasLayer(m)) map.addLayer(m);
              map.flyTo(m.getLatLng(), 10, { duration: 0.9 });
              setTimeout(() => m.openPopup(), 950);
            }, 180);
          });
        });

        if (overlay) overlay.classList.add("tm-hidden");
        setTimeout(() => { try { map.invalidateSize(); } catch (_) {} }, 60);
      }

      const original = window.activateTab;
      window.activateTab = function (id) {
        if (typeof original === "function") original.apply(this, arguments);
        if (id === "izland2") setTimeout(init, 0);
      };
      if (document.querySelector('.view.is-active[data-view="izland2"]')) {
        setTimeout(init, 0);
      }
    })();
  </script>

            const cbs = [];

              cbs.push(cb);

          const m = L.marker([s.lat, s.lng], { icon, riseOnHover: true }).addTo(map);
          const dt = (s.date || "").replace(/^2026-/, "").replace("-", ".");
          m.bindPopup(`<div class="iz2-pp"><div class="iz2-pp-t">${s.name}</div><div class="iz2-pp-d">${s.day}. nap · ${dt} · ${kc.emoji} ${kc.label}</div><div class="iz2-pp-n">${s.detail || ""}${s.reviewNote ? `<br><em>${s.reviewNote}</em>` : ""}</div></div>`);
          if (ov) m.bindTooltip(s.name.split(" (")[0], { permanent: true, direction: "top", offset: [0, -(size / 2)], className: "iz2-stay-label" });
          markerList.push({ marker: m, day: s.day, kind: s.kind });
          markersByName[s.name] = m;
        });
        const initialBounds = bounds.length ? L.latLngBounds(bounds) : null;
        if (initialBounds) map.fitBounds(initialBounds, { padding: [40, 40] });

        // Útvonal a route.json hazaut feature-jeiből (autóút + komp + nyitó repülő)
        fetch(ROUTE_URL).then((r) => r.json()).then((geo) => {
          (geo.features || []).filter((f) => f.properties && f.properties.stage === "hazaut").forEach((f) => {
            const t = f.properties.type;
            const style = t === "ferry"
              ? { color: "#1d4ed8", weight: 2.5, opacity: 0.85, dashArray: "6 8" }
              : t === "flight"
                ? { color: "#64748b", weight: 2, opacity: 0.7, dashArray: "2 9" }
                : { color: "#8a4f24", weight: 3, opacity: 0.8 };
            L.geoJSON(f, { style }).addTo(map);
          });
          const rs = document.getElementById("hazaut2-routestat");
          if (rs) rs.textContent = "Útvonal: a nyitó KEF→Stockholm repülő (pontozott), a Vaxholm-komp (szaggatott kék) és a Stockholm→Budapest autós ív (folytonos), valós úthálózaton.";
        }).catch(() => {
          const rs = document.getElementById("hazaut2-routestat");
          if (rs) rs.textContent = "Az útvonal most nem érhető el.";
        });

        // Reset gomb
        const ResetCtl = L.Control.extend({
          options: { position: "topright" },
          onAdd() {
            const b = L.DomUtil.create("button", "iz2-reset-btn");
            b.type = "button"; b.title = "Vissza a teljes nézetre"; b.setAttribute("aria-label", "Vissza a teljes nézetre"); b.innerHTML = "⤢";
            L.DomEvent.disableClickPropagation(b);
            L.DomEvent.on(b, "click", (e) => { L.DomEvent.stop(e); if (initialBounds) map.fitBounds(initialBounds, { padding: [40, 40] }); });
            return b;
          }
        });
        map.addControl(new ResetCtl());

        // Szűrő-sidebar (Napok + Típus)
        const sidebar = document.getElementById("hazaut2-map-filter");
        if (sidebar && !sidebar.childElementCount) {
          const presentKinds = Object.keys(KIND).filter((k) => markerList.some((m) => m.kind === k));
          const state = { days: new Set(presentDays), kinds: new Set(presentKinds) };
          function applyFilter() {
            for (const item of markerList) {
              const vis = state.days.has(item.day) && state.kinds.has(item.kind);
              if (vis) { if (!map.hasLayer(item.marker)) map.addLayer(item.marker); }
              else { if (map.hasLayer(item.marker)) map.removeLayer(item.marker); }
            }
          }
          function makeSection(title, items, stateKey, scrollable) {
            const sec2 = document.createElement("div"); sec2.className = "dm-filter-section";
            const head = document.createElement("div"); head.className = "dm-filter-section-head";
            const ttl = document.createElement("strong"); ttl.textContent = title;
            const acts = document.createElement("span"); acts.className = "dm-filter-actions";
            const allB = document.createElement("button"); allB.className = "dm-btn-all"; allB.type = "button"; allB.textContent = "Mind";
            const noneB = document.createElement("button"); noneB.className = "dm-btn-none"; noneB.type = "button"; noneB.textContent = "Egyik sem";
            acts.append(allB, noneB); head.append(ttl, acts); sec2.appendChild(head);
            const body = document.createElement("div"); body.className = "dm-filter-section-body" + (scrollable ? " dm-filter-scrollable" : "");
            const cbs = [];
            for (const item of items) {
              const lbl = document.createElement("label"); lbl.className = "dm-filter-row";
              const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = state[stateKey].has(item.id);
              cb.addEventListener("change", () => { if (cb.checked) state[stateKey].add(item.id); else state[stateKey].delete(item.id); applyFilter(); });
              cbs.push(cb);
              const span = document.createElement("span"); span.className = "dm-filter-label";
              if (item.dotColor) { const dot = document.createElement("span"); dot.className = "dm-dot"; dot.style.background = item.dotColor; span.appendChild(dot); }
              span.appendChild(document.createTextNode(item.label));
              lbl.append(cb, span); body.appendChild(lbl);
            }
            allB.addEventListener("click", () => { items.forEach((i) => state[stateKey].add(i.id)); cbs.forEach((c) => c.checked = true); applyFilter(); });
            noneB.addEventListener("click", () => { state[stateKey].clear(); cbs.forEach((c) => c.checked = false); applyFilter(); });
            sec2.appendChild(body); return sec2;
          }
          const header = document.createElement("div"); header.className = "dm-sidebar-header"; header.textContent = "Szűrők"; sidebar.appendChild(header);
          sidebar.appendChild(makeSection("Napok", presentDays.map((d) => ({ id: d, label: `${d}. ${dayTitle[d] || "nap"}`, dotColor: dayColor(d) })), "days", true));
          const hr = document.createElement("hr"); hr.className = "dm-filter-divider"; sidebar.appendChild(hr);
          sidebar.appendChild(makeSection("Típus", presentKinds.map((k) => ({ id: k, label: `${kindOf(k).emoji} ${kindOf(k).label}` })), "kinds", false));
        }

        // Jelmagyarázat
        const leg = document.getElementById("hazaut2-legend");
        if (leg && !leg.childElementCount) {
          presentDays.forEach((d) => { const sp = document.createElement("span"); sp.innerHTML = `<span class="iz2-dot" style="background:${dayColor(d)}"></span>${d}. ${dayTitle[d] || "nap"}`; leg.appendChild(sp); });
          const ov = document.createElement("span"); ov.innerHTML = `<span class="iz2-leg-stay">🏨</span>Éjszakai bázis`; leg.appendChild(ov);
        }

        // Menetrend "🗺" gomb → a saját Hazaút-térkép a ponthoz repül
        const mapPanel = el.closest("details.iz2-map-panel");
        document.querySelectorAll('.view[data-view="hazaut"] .bm-maplink').forEach((link) => {
          link.addEventListener("click", (ev) => {
            ev.preventDefault();
            const m = markersByName[link.getAttribute("data-bm-name")];
            if (!m) return;
            if (mapPanel && !mapPanel.open) mapPanel.open = true;
            (mapPanel || wrap || el).scrollIntoView({ behavior: "smooth", block: "start" });
            setTimeout(() => {
              try { map.invalidateSize(); } catch (_) {}
              if (!map.hasLayer(m)) map.addLayer(m);
              map.flyTo(m.getLatLng(), 11, { duration: 0.9 });
              setTimeout(() => m.openPopup(), 950);
            }, 180);
          });
        });

        if (overlay) overlay.classList.add("tm-hidden");
        setTimeout(() => { try { map.invalidateSize(); } catch (_) {} }, 60);
      }

      const original = window.activateTab;
      window.activateTab = function (id) {
        if (typeof original === "function") original.apply(this, arguments);
        if (id === "hazaut") setTimeout(init, 0);
      };
      if (document.querySelector('.view.is-active[data-view="hazaut"]')) {
        setTimeout(init, 0);
      }
    })();

  <!-- Térkép fül — teljes út áttekintő (szakasz-stílusú: típus-ikonok + összes route + Fázis/Típus szűrő + reset + legend) -->
  <script>
    (function () {
      const td = (typeof tripData !== "undefined" ? tripData : null);
      if (!td) return;
      const inited = new Set();
      const apis = {};

      const KIND = {
        city:       { emoji: "🏙️", label: "Város" },
        oldtown:    { emoji: "🏛️", label: "Óváros / negyed" },
        castle:     { emoji: "🏰", label: "Vár / kastély" },
        church:     { emoji: "⛪", label: "Templom" },
        museum:     { emoji: "🖼️", label: "Múzeum" },
        nature:     { emoji: "🌳", label: "Természet / park" },
        viewpoint:  { emoji: "📸", label: "Kilátó / fotó" },
        market:     { emoji: "🛍️", label: "Piac / street food" },
        waterfall:  { emoji: "💧", label: "Vízesés" },
        geothermal: { emoji: "♨️", label: "Geotermikus / gejzír" },
        bath:       { emoji: "🛁", label: "Fürdő / lagúna" },
        glacier:    { emoji: "🧊", label: "Gleccser / jég" },
        beach:      { emoji: "🏖️", label: "Fekete strand" },
        ferry:      { emoji: "⛴️", label: "Komp" },
        flight:     { emoji: "✈️", label: "Repülő" },
        stay:       { emoji: "🏨", label: "Szállás (éjszaka)" }
      };
      // az izlandi finomabb típusok normalizálása a közös készletre
      const normKind = (k) => ({ photo: "viewpoint", town: "city", park: "nature" }[k] || k || "other");
      const kindOf = (k) => KIND[k] || { emoji: "📍", label: "Egyéb" };

      const PHASES = [
        { id: "baltikum", color: "#8a4f24", label: "Baltikum", sub: "júl. 10–18." },
        { id: "izland",   color: "#1f5a3e", label: "Izland",   sub: "júl. 18–26." },
        { id: "hazaut",   color: "#6a4ca3", label: "Hazaút",   sub: "júl. 26 – aug. 6." }
      ];
      const phaseColor = (id) => (PHASES.find((p) => p.id === id) || {}).color || "#64748b";
      const ROUTE_URL = "../../data/trips/izland-es-eszak-europa/route.json";

      const HU_MONTH = { január:1, február:2, március:3, április:4, május:5, június:6, július:7, augusztus:8, szeptember:9, október:10, november:11, december:12 };
      function fmtDate(d) {
        if (!d) return "";
        const iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(d);
        if (iso) return `${+iso[2]}.${+iso[3]}`;
        const m = /([A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüű]+)\s+(\d{1,2})\./.exec(d);
        if (m) { const mon = HU_MONTH[m[1].toLowerCase()]; if (mon) return `${mon}.${m[2]}`; }
        return "";
      }

      function collectStops() {
        const out = [];
        (td.sections.baltikum?.mapStops || []).forEach((s) => { if (s.lat != null) out.push({ name: s.name, kind: normKind(s.kind), lat: s.lat, lng: s.lng, date: s.date, detail: s.detail, reviewNote: s.reviewNote, phase: "baltikum" }); });
        (td.sections.izland2?.days || []).forEach((d) => (d.gpxPlaces || []).forEach((p) => { if (p.lat != null) out.push({ name: p.name, kind: normKind(p.kind), lat: p.lat, lng: p.lng, date: d.date, detail: p.detail, reviewNote: p.reviewNote, phase: "izland" }); }));
        (td.sections.hazaut?.mapStops || []).forEach((s) => { if (s.lat != null) out.push({ name: s.name, kind: normKind(s.kind), lat: s.lat, lng: s.lng, date: s.date, detail: s.detail, reviewNote: s.reviewNote, phase: "hazaut" }); });
        return out;
      }

      function buildFullTripMap(o) {
        if (inited.has(o.mapId)) return apis[o.mapId];
        const L = window.L;
        const el = document.getElementById(o.mapId);
        if (!L || !el) return null;
        inited.add(o.mapId);
        const wrap = el.closest(".travel-map-wrap");
        const overlay = wrap && wrap.querySelector(".tm-overlay");

        const map = L.map(o.mapId, { scrollWheelZoom: false }).setView([58, 8], 4);
        window._leafletMaps = window._leafletMaps || {};
        window._leafletMaps[o.mapId] = map;
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19
        }).addTo(map);

        const stops = collectStops();
        const markerList = [], bounds = [];
        stops.forEach((s) => {
          bounds.push([s.lat, s.lng]);
          const ov = s.kind === "stay";
          const kc = kindOf(s.kind);
          const size = ov ? 30 : 26;
          const color = phaseColor(s.phase);
          const icon = L.divIcon({
            className: "",
            html: `<div class="iz2-pin${ov ? " iz2-pin-ov" : ""}" style="--c:${color};width:${size}px;height:${size}px"><span>${ov ? "🏨" : kc.emoji}</span></div>`,
            iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2]
          });
          const m = L.marker([s.lat, s.lng], { icon, riseOnHover: true }).addTo(map);
          const ph = PHASES.find((p) => p.id === s.phase);
          const dt = fmtDate(s.date);
          m.bindPopup(`<div class="iz2-pp"><div class="iz2-pp-t">${s.name}</div><div class="iz2-pp-d">${ph ? ph.label : ""}${dt ? " · " + dt : ""} · ${kc.emoji} ${kc.label}</div><div class="iz2-pp-n">${s.detail || ""}${s.reviewNote ? `<br><em>${s.reviewNote}</em>` : ""}</div></div>`);
          markerList.push({ marker: m, phase: s.phase, kind: s.kind });
        });
        const initialBounds = bounds.length ? L.latLngBounds(bounds) : null;
        if (initialBounds) map.fitBounds(initialBounds, { padding: [40, 40] });

        // Útvonal: az ÖSSZES route.json feature — autó fázisszínnel, komp kék szaggatott, repülő pontozott
        getRoute().then((geo) => {
          (geo.features || []).forEach((f) => {
            const p = f.properties || {};
            const t = p.type;
            const style = t === "ferry"
              ? { color: "#1d4ed8", weight: 2.5, opacity: 0.85, dashArray: "6 8" }
              : t === "flight"
                ? { color: "#7c3aed", weight: 2, opacity: 0.7, dashArray: "2 9" }
                : { color: phaseColor(p.stage), weight: 3, opacity: 0.8 };
            L.geoJSON(f, { style }).addTo(map);
          });
          const rs = document.getElementById(o.routestatId);
          if (rs) rs.textContent = "Teljes útvonal: autóutak fázisszínnel (folytonos), kompok (szaggatott kék), repülők (pontozott) — valós OSRM úthálózaton.";
        }).catch(() => {
          const rs = document.getElementById(o.routestatId);
          if (rs) rs.textContent = "Az útvonal most nem érhető el.";
        });

        // Reset gomb
        const ResetCtl = L.Control.extend({
          options: { position: "topright" },
          onAdd() {
            const b = L.DomUtil.create("button", "iz2-reset-btn");
            b.type = "button"; b.title = "Vissza a teljes nézetre"; b.setAttribute("aria-label", "Vissza a teljes nézetre"); b.innerHTML = "⤢";
            L.DomEvent.disableClickPropagation(b);
            L.DomEvent.on(b, "click", (e) => { L.DomEvent.stop(e); if (initialBounds) map.fitBounds(initialBounds, { padding: [40, 40] }); });
            return b;
          }
        });
        map.addControl(new ResetCtl());

        // Szűrő-állapot (a sidebar felépítésétől függetlenül, hogy a fókusz-API mindig működjön)
        const presentKinds = Object.keys(KIND).filter((k) => markerList.some((m) => m.kind === k));
        const state = { phases: new Set(PHASES.map((p) => p.id)), kinds: new Set(presentKinds) };
        const phaseCbs = [];
        function applyFilter() {
          for (const item of markerList) {
            const vis = state.phases.has(item.phase) && state.kinds.has(item.kind);
            if (vis) { if (!map.hasLayer(item.marker)) map.addLayer(item.marker); }
            else { if (map.hasLayer(item.marker)) map.removeLayer(item.marker); }
          }
        }

        // Szűrő-sidebar (Fázis + Típus)
        const sidebar = document.getElementById(o.sidebarId);
        if (sidebar && !sidebar.childElementCount) {
          function makeSection(title, items, stateKey, scrollable) {
            const sec2 = document.createElement("div"); sec2.className = "dm-filter-section";
            const head = document.createElement("div"); head.className = "dm-filter-section-head";
            const ttl = document.createElement("strong"); ttl.textContent = title;
            const acts = document.createElement("span"); acts.className = "dm-filter-actions";
            const allB = document.createElement("button"); allB.className = "dm-btn-all"; allB.type = "button"; allB.textContent = "Mind";
            const noneB = document.createElement("button"); noneB.className = "dm-btn-none"; noneB.type = "button"; noneB.textContent = "Egyik sem";
            acts.append(allB, noneB); head.append(ttl, acts); sec2.appendChild(head);
            const body = document.createElement("div"); body.className = "dm-filter-section-body" + (scrollable ? " dm-filter-scrollable" : "");
            const cbs = [];
            for (const item of items) {
              const lbl = document.createElement("label"); lbl.className = "dm-filter-row";
              const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = state[stateKey].has(item.id);
              cb.addEventListener("change", () => { if (cb.checked) state[stateKey].add(item.id); else state[stateKey].delete(item.id); applyFilter(); });
              cbs.push(cb);
              if (stateKey === "phases") phaseCbs.push({ cb, id: item.id });
              const span = document.createElement("span"); span.className = "dm-filter-label";
              if (item.dotColor) { const dot = document.createElement("span"); dot.className = "dm-dot"; dot.style.background = item.dotColor; span.appendChild(dot); }
              span.appendChild(document.createTextNode(item.label));
              if (item.sub) { const sub = document.createElement("span"); sub.className = "dm-filter-sub"; sub.textContent = item.sub; span.appendChild(sub); }
              lbl.append(cb, span); body.appendChild(lbl);
            }
            allB.addEventListener("click", () => { items.forEach((i) => state[stateKey].add(i.id)); cbs.forEach((c) => c.checked = true); applyFilter(); });
            noneB.addEventListener("click", () => { state[stateKey].clear(); cbs.forEach((c) => c.checked = false); applyFilter(); });
            sec2.appendChild(body); return sec2;
          }
          const header = document.createElement("div"); header.className = "dm-sidebar-header"; header.textContent = "Szűrők"; sidebar.appendChild(header);
          sidebar.appendChild(makeSection("Fázisok", PHASES.map((p) => ({ id: p.id, label: p.label, dotColor: p.color, sub: p.sub })), "phases", false));
          const hr = document.createElement("hr"); hr.className = "dm-filter-divider"; sidebar.appendChild(hr);
          sidebar.appendChild(makeSection("Típus", presentKinds.map((k) => ({ id: k, label: `${kindOf(k).emoji} ${kindOf(k).label}` })), "kinds", true));
        }

        // Jelmagyarázat (3 fázis + szállás)
        const leg = document.getElementById(o.legendId);
        if (leg && !leg.childElementCount) {
          PHASES.forEach((p) => { const sp = document.createElement("span"); sp.innerHTML = `<span class="iz2-dot" style="background:${p.color}"></span>${p.label}`; leg.appendChild(sp); });
          const ovl = document.createElement("span"); ovl.innerHTML = `<span class="iz2-leg-stay">🏨</span>Éjszakai szállás`; leg.appendChild(ovl);
        }

        if (overlay) overlay.classList.add("tm-hidden");
        setTimeout(() => { try { map.invalidateSize(); } catch (_) {} }, 60);

        const api = {
          showPhase(id) {
            state.phases.clear(); state.phases.add(id);
            phaseCbs.forEach(({ cb, id: cid }) => { cb.checked = (cid === id); });
            applyFilter();
          },
          showAll() {
            PHASES.forEach((p) => state.phases.add(p.id));
            phaseCbs.forEach(({ cb }) => { cb.checked = true; });
            applyFilter();
          }
        };
        apis[o.mapId] = api;
        return api;
      }

      let routePromise = null;
      function getRoute() { return routePromise || (routePromise = fetch(ROUTE_URL).then((r) => r.json())); }

      const TERKEP = { mapId: "terkep-map", sidebarId: "terkep-map-filter", routestatId: "terkep-routestat", legendId: "terkep-legend" };
      const OVERVIEW = { mapId: "overview-map", sidebarId: "overview-map-filter", routestatId: "overview-routestat", legendId: "overview-legend" };

      function initOverview() {
        const api = buildFullTripMap(OVERVIEW);
        if (api) window.overviewMapAPI = { focusPhase: (id) => api.showPhase(id), showAll: () => api.showAll() };
      }

      const original = window.activateTab;
      window.activateTab = function (id) {
        if (typeof original === "function") original.apply(this, arguments);
        if (id === "terkep") setTimeout(() => buildFullTripMap(TERKEP), 0);
        if (id === "overview") setTimeout(initOverview, 0);
      };
      // Az Áttekintés az alapból aktív fül → a térkép azonnal épüljön, és álljon rendelkezésre az overviewMapAPI a timeline-fókuszhoz
      setTimeout(initOverview, 30);
      if (document.querySelector('.view.is-active[data-view="terkep"]')) {
        setTimeout(() => buildFullTripMap(TERKEP), 0);
      }
    })();
  </script>
