<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌋 Izland es eszak Europa · 2026</title>
  <link rel="stylesheet" href="./styles.css">
  <!-- Map engine CSS — travel-map-wrap, map-filter-wrap, dm-filter-sidebar, tm-marker stb. -->
  <link rel="stylesheet" href="../../engine/map.css">
  <!-- Leaflet 1.9.4 — jsDelivr (gyorsabb, megbízható SRI) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet.markercluster 1.5.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-top">
        <div class="hero-copy">
          <h1 id="hero-title"></h1>
          <p id="hero-subtitle"></p>
        </div>
        <div class="ticket-groups" id="ticket-groups"></div>
      </div>
      <div class="route" id="route"></div>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <main id="views"></main>
  </div>

  <script src="./trip-data.js"></script>
  <script>
    const tabs = [
      { id: "overview", label: "Áttekintés" },
      { id: "tibi", label: "Tibi" },
      { id: "henni", label: "Henni" },
      { id: "baltikum", label: "Baltikum" },
      { id: "izland", label: "Izland" },
      { id: "hazaut", label: "Hazaút" },
      { id: "restaurants", label: "Gasztronómia" },
      { id: "practical", label: "🧳 Praktikus" },
      { id: "weather", label: "🌦 Időjárás" },
      { id: "terkep", label: "🗺 Térkép" },
      { id: "info", label: "Info" },
      { id: "apps", label: "📱 App" },
      { id: "budget", label: "💶 Költségvetés" }
    ];

    const heroTitle = document.getElementById("hero-title");
    const heroSubtitle = document.getElementById("hero-subtitle");
    const ticketGroups = document.getElementById("ticket-groups");
    const route = document.getElementById("route");
    const tabsEl = document.getElementById("tabs");
    const views = document.getElementById("views");

    heroTitle.textContent = tripData.title;
    heroSubtitle.textContent = `${tripData.subtitle} · Frissítve: ${tripData.updatedAt}`;

    tripData.ticketGroups.forEach((group) => {
      const card = document.createElement("details");
      card.className = "ticket-group";
      card.open = false;
      card.innerHTML = `
        <summary class="ticket-group-summary">
          <div class="ticket-group-head">
            <div>
              <h3>${group.person} <span class="ticket-person-note">(${group.summary})</span></h3>
            </div>
          </div>
          <span class="ticket-group-icon" aria-hidden="true">▾</span>
        </summary>
        <div class="ticket-group-body">
          <div class="ticket-group-grid">
            ${group.items.map((item) => `
              <article class="ticket-card">
                <div class="ticket-card-top">
                  <span class="ticket-badge">${item.mode}</span>
                  <span class="ticket-status">${item.status}</span>
                </div>
                <strong>${item.operator} · ${item.code}</strong>
                ${item.bookingRef ? `<div class="ticket-pnr">Foglalási kód: <span class="pnr-code">${item.bookingRef}</span></div>` : ""}
                <div class="ticket-route">${item.route}</div>
                <div class="ticket-meta">Indulás: ${item.departure} helyi idő</div>
                <div class="ticket-meta">Érkezés: ${item.arrival} helyi idő <span class="ticket-duration">(${item.duration})</span></div>
                ${item.bookingCom ? `<div class="ticket-meta ticket-meta-sm">Booking.com: ${item.bookingCom}</div>` : ""}
                ${item.baggage ? `<div class="ticket-meta ticket-meta-sm">🧳 ${item.baggage}</div>` : ""}
                ${item.links && item.links.length ? `<div class="ticket-links">${item.links.map((link) => `<a href="${link.url}" target="_blank" rel="noreferrer">${link.label}</a>`).join(" · ")}</div>` : ""}
              </article>
            `).join("")}
          </div>
          ${group.note ? `<div class="flight-note">${group.note}</div>` : ""}
        </div>
      `;
      ticketGroups.appendChild(card);
    });

    tripData.route.forEach((item) => {
      const node = document.createElement("span");
      if (item.separator) {
        node.className = "route-sep";
        node.innerHTML = item.separator
          .replaceAll("→", '<span class="sep-arrow">→</span>')
          .replaceAll("✈", '<span class="sep-icon">✈</span>')
          .replaceAll("🚗", '<span class="sep-icon">🚗</span>')
          .replaceAll("🚢", '<span class="sep-icon">🚢</span>');
      } else {
        node.className = `route-stop ${item.cls}`;
        node.textContent = item.label;
      }
      route.appendChild(node);
    });

    function renderLinkList(links, cls = "source-chip") {
      return (links || []).map((link) => `
        <a class="${cls}" href="${link.url}" target="_blank" rel="noreferrer">${link.label}</a>
      `).join("");
    }

    function detailsOpenAttr(isOpen, forceClosed = false) {
      return !forceClosed && isOpen ? "open" : "";
    }

    function renderDriveTimeline(points) {
      if (!points || points.length < 2) return "";

      function pct(timeStr) {
        const m = timeStr.match(/(\d{1,2}):(\d{2})/);
        if (!m) return null;
        return ((parseInt(m[1]) + parseInt(m[2]) / 60) / 24) * 100;
      }

      const ticks = [
        { p: 25, label: "06:00" },
        { p: 50, label: "12:00" },
        { p: 75, label: "18:00" }
      ];

      const ticksHtml = ticks.map((t) => `
        <div class="dtl-tick" style="left:${t.p}%"></div>
        <div class="dtl-tick-label" style="left:${t.p}%">${t.label}</div>
      `).join("");

      const dotsHtml = points.map((pt, i) => {
        const p = pct(pt.time);
        const left = p !== null ? p : (i / (points.length - 1)) * 100;
        const cls = i === 0 ? "dtl-point dtl-start" : i === points.length - 1 ? "dtl-point dtl-end" : "dtl-point";
        const xform = left < 12 ? "translateX(0)" : left > 88 ? "translateX(-100%)" : "translateX(-50%)";
        const align = left < 12 ? "flex-start" : left > 88 ? "flex-end" : "center";
        return `
          <div class="${cls}" style="left:${left.toFixed(1)}%;transform:${xform};align-items:${align}">
            <div class="dtl-dot"></div>
            <div class="dtl-time">${pt.time}</div>
            <div class="dtl-label">${pt.label}</div>
          </div>
        `;
      }).join("");

      return `
        <div class="drive-timeline">
          <div class="drive-timeline-rail"></div>
          ${ticksHtml}
          ${dotsHtml}
        </div>
      `;
    }

    function renderOverviewMap() {
      const lines = tripData.map.paths.map((path) => {
        const from = tripData.map.nodes.find((node) => node.id === path.from);
        const to = tripData.map.nodes.find((node) => node.id === path.to);
        return `
          <line
            x1="${from.x}"
            y1="${from.y}"
            x2="${to.x}"
            y2="${to.y}"
            stroke="${path.color}"
            stroke-width="${path.width || 4}"
            stroke-linecap="round"
            ${path.dashed ? 'stroke-dasharray="7 6"' : ""}
          />
        `;
      }).join("");

      const nodes = tripData.map.nodes.map((node) => `
        <g class="map-node" onclick="activateTab('${node.tab}')">
          <circle cx="${node.x}" cy="${node.y}" r="${node.major ? 9 : 7}" fill="${node.color}" />
          <text x="${node.x + 12}" y="${node.y - 2}" class="map-label">${node.label}</text>
          ${node.note ? `<text x="${node.x + 12}" y="${node.y + 11}" class="map-note">${node.note}</text>` : ""}
        </g>
      `).join("");

      return `
        <svg class="overview-map" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Észak-Európa és Izland útvonal">
          <rect x="0" y="0" width="360" height="300" rx="18" fill="#f8f3eb"></rect>
          <text x="30" y="35" class="map-note">Atlanti-óceán</text>
          <text x="208" y="42" class="map-note">Balti-tenger</text>
          <text x="238" y="116" class="map-note">Skandinávia</text>
          ${lines}
          ${nodes}
        </svg>
      `;
    }

    function renderOverviewTimelineRow(day) {
      return `
        <article class="timeline-day-row ${day.accent}">
          <div class="timeline-day-head">
            <div class="timeline-date">${day.date}</div>
          </div>
          <h3>${day.title}</h3>
          <div class="timeline-note">${day.summary}</div>
          ${day.driveStats ? `
            <div class="timeline-drive-stats">
              ${day.driveStats.km ? `<span class="ds-chip ds-km">🚗 ${day.driveStats.km}</span>` : ""}
              ${day.driveStats.stops ? `<span class="ds-chip ds-stops">📍 ${day.driveStats.stops} megálló</span>` : ""}
              ${day.driveStats.depart ? `<span class="ds-chip ds-time">⏱ ${day.driveStats.depart} → ${day.driveStats.arrive}</span>` : ""}
              ${day.driveStats.driveTime ? `<span class="ds-chip ds-drive">🕐 ${day.driveStats.driveTime} vezetés</span>` : ""}
            </div>
            ${renderDriveTimeline(day.driveStats.timelinePoints)}
          ` : ""}
          ${day.henniBox ? `
            <div class="timeline-henni-box">
              <span class="thb-icon">${day.henniBox.icon}</span>
              <div class="thb-content">
                <div class="thb-label">${day.henniBox.label}</div>
                <div class="thb-title">${day.henniBox.title}</div>
                ${day.henniBox.detail ? `<div class="thb-detail">${day.henniBox.detail}</div>` : ""}
              </div>
            </div>
          ` : ""}
        </article>
      `;
    }

    function renderOverview() {
      const balticTimeline  = tripData.overview.timeline.filter((d) => d.phase.startsWith("Tibi"));
      const icelandTimeline = tripData.overview.timeline.filter((d) => d.phase === "Közös Izland");
      const returnTimeline  = tripData.overview.timeline.filter((d) => d.phase === "Közös hazaút");
      // Stage id used by overviewMapAPI.focusPhase()
      const PHASE_STAGE = { baltic: "baltikum", iceland: "izland", return: "hazaut" };

      function phaseGroup(id, emoji, title, sub, days, open) {
        return `
          <details class="timeline-phase-details" ${open ? "open" : ""}
            ontoggle="if(this.open && window.overviewMapAPI) window.overviewMapAPI.focusPhase('${PHASE_STAGE[id]}')">
            <summary class="timeline-phase-summary">
              <div class="timeline-phase-summary-left">
                <span class="timeline-phase-emoji">${emoji}</span>
                <div>
                  <div class="timeline-phase-title">${title}</div>
                  <div class="timeline-phase-sub">${sub}</div>
                </div>
              </div>
              <span class="timeline-phase-count">${days.length} nap</span>
              <span class="timeline-phase-chevron" aria-hidden="true">▾</span>
            </summary>
            <div class="timeline-phase-body">
              <div class="timeline-rail">
                ${days.map(renderOverviewTimelineRow).join("")}
              </div>
            </div>
          </details>`;
      }
      return `
        <section class="view is-active" data-view="overview">
          <div class="overview-grid">
            <div class="stack">
              <section class="card">
                <h2 class="section-title">📅 Napi idővonal</h2>
                <div class="timeline-group-stack">
                  ${phaseGroup("baltic",  "🗺", "Baltikum",  "júl. 10–18. · Tibi autós felvezető · Lengyelország → Észtország → Helsinki → Stockholm", balticTimeline,  true)}
                  ${phaseGroup("iceland", "🇮🇸", "Izland",    "júl. 18–26. · közös Ring Road körút · Reykjavík → Snæfellsnes → Észak → Kelet → Déli part", icelandTimeline, false)}
                  ${phaseGroup("return",  "🚗", "Hazaút",    "júl. 26. – aug. 6. · Stockholm → Koppenhága → Hamburg → Frankfurt → Budapest", returnTimeline,  false)}
                </div>
              </section>
              <details class="card section-card coll-card" open>
                <summary class="coll-card-head">
                  <span class="map-section-title" style="margin:0;">🗺 Interaktív útvonal-térkép</span>
                  <span class="collapse-icon" aria-hidden="true">▾</span>
                </summary>
                <p class="section-intro" style="margin-bottom:10px;">
                  Minden állomás szakasz, típus és nap szerint szűrhető.
                  Egy fázis kinyitása a napi idővonalban automatikusan arra szűr a térképen.
                </p>
                <div class="map-filter-wrap">
                  <div class="travel-map-wrap" style="height:420px;">
                    <div id="overview-map" style="width:100%;height:100%;"></div>
                    <div class="tm-overlay">
                      <div class="tm-spinner"></div>
                      <span>Térkép betöltése…</span>
                    </div>
                  </div>
                  <aside class="dm-filter-sidebar" id="overview-map-filter"></aside>
                </div>
              </details>
            </div>
            <div class="stack">
              <section class="card">
                <h2 class="section-title">🧭 Országonként</h2>
                <div class="country-summary-stack">
                  ${tripData.overview.countrySummaries.map((country) => `
                    <article class="country-summary-box ${country.accent}">
                      <h3>${country.title}</h3>
                      <p>${country.text}</p>
                      <ul>
                        ${country.points.map((point) => `<li><strong>${point.label}:</strong> ${point.value}</li>`).join("")}
                      </ul>
                    </article>
                  `).join("")}
                </div>
              </section>
              <section class="card">
                <h2 class="section-title">🧭 Fő utazások</h2>
                <div class="summary-grid">
                  ${tripData.overview.mainTrips.map((trip) => `
                    <article class="summary-card ${trip.accent}">
                      <h3>${trip.title}</h3>
                      <p>${trip.text}</p>
                      <button class="jump-btn" type="button" onclick="activateTab('${trip.tab}')">${trip.cta}</button>
                    </article>
                  `).join("")}
                </div>
              </section>
              <section class="card">
                <h2 class="section-title">⚠️ Fontos</h2>
                <ul class="badge-list">
                  ${tripData.overview.important.map((item) => `<li><span class="badge badge-gold">FONTOS</span><strong>${item}</strong></li>`).join("")}
                </ul>
              </section>
            </div>
          </div>

        </section>
      `;
    }

    function renderStageCard(stage) {
      return `
        <article class="summary-card ${stage.accent}">
          <div class="stage-card-top">
            <h3>${stage.title}</h3>
            <span class="status-chip ${stage.statusClass}">${stage.status}</span>
          </div>
          <p>${stage.text}</p>
          <ul class="plain-list compact">
            ${stage.points.map((point) => `<li>${point}</li>`).join("")}
          </ul>
          ${stage.cta ? `<button class="jump-btn" type="button" onclick="activateTab('${stage.cta.tab}')">${stage.cta.label}</button>` : ""}
        </article>
      `;
    }

    function renderPersonView(personKey) {
      const person = tripData.people[personKey];
      const stages = person.stageKeys.map((key) => tripData.stageLibrary[key]);
      return `
        <section class="view" data-view="${personKey}">
          <div class="section-head">
            <div>
              <h2><span>${person.kicker}</span>${person.title}</h2>
            </div>
          </div>
          <div class="note-card info full-width-card">
            <p>${person.intro}</p>
          </div>
          <div class="summary-grid stage-grid">
            ${stages.map(renderStageCard).join("")}
          </div>
        </section>
      `;
    }

    function renderCountryContext(section, forceClosed = false) {
      return section.context.map((block) => `
        <details class="country-context ${block.accent}" ${detailsOpenAttr(block.open, forceClosed)}>
          <summary class="collapse-summary">
            <span>${block.title}</span>
            <span class="collapse-icon" aria-hidden="true">▾</span>
          </summary>
          <div class="country-context-body">
            <div class="context-grid">
              ${block.cards.map((card) => `
                <article class="context-card">
                  <h3>${card.title}</h3>
                  ${card.paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}
                </article>
              `).join("")}
            </div>
            ${block.links && block.links.length ? `<div class="context-sources">${renderLinkList(block.links)}</div>` : ""}
          </div>
        </details>
      `).join("");
    }

    function renderCollapseBox(block, forceClosed = false) {
      if (!block) return "";
      return `
        <details class="country-context ${block.accent}" ${detailsOpenAttr(block.open, forceClosed)}>
          <summary class="collapse-summary">
            <span>${block.title}</span>
            <span class="collapse-icon" aria-hidden="true">▾</span>
          </summary>
          <div class="country-context-body">
            ${block.cards && block.cards.length ? `
              <div class="context-grid ${block.layout === "stack" ? "context-grid-stack" : ""}">
                ${block.cards.map((card) => `
                  <article class="context-card">
                    <h3>${card.title}</h3>
                    ${card.paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}
                  </article>
                `).join("")}
              </div>
            ` : ""}
            ${block.links && block.links.length ? `<div class="context-sources">${renderLinkList(block.links)}</div>` : ""}
          </div>
        </details>
      `;
    }

    function renderDayCard(day, accentClass, forceClosed = false) {
      return `
        <details class="day-card ${accentClass}" ${detailsOpenAttr(day.open, forceClosed)}>
          <summary class="day-head">
            <div class="day-num">${day.num}</div>
            <div class="day-info">
              <div class="day-date">${day.date}</div>
              <div class="day-title">${day.title}</div>
              <div class="day-sub">${day.subtitle}</div>
              <div class="day-tags">
                ${day.tags.map((tag) => `<span class="tag ${tag.cls}">${tag.label}</span>`).join("")}
              </div>
              ${day.rainNote ? `<div class="day-rain-note"><span>${day.rainNote.icon}</span><span>${day.rainNote.label}</span></div>` : ""}
              ${day.driveLog ? `
                <div class="day-drive-log">
                  ${day.driveLog.km ? `<span class="dl-chip dl-km">🚗 ${day.driveLog.km}</span>` : ""}
                  ${day.driveLog.stops ? `<span class="dl-chip dl-stops">📍 ${day.driveLog.stops} megálló</span>` : ""}
                  ${day.driveLog.driveTime ? `<span class="dl-chip dl-drive">🕐 ${day.driveLog.driveTime} vezetés</span>` : ""}
                  ${day.driveLog.depart ? `<span class="dl-chip dl-time">⏱ ind. ${day.driveLog.depart} · erk. ${day.driveLog.arrive}</span>` : ""}
                </div>
                ${renderDriveTimeline(day.driveLog.timelinePoints)}
              ` : ""}
            </div>
            <div class="chevron">▾</div>
          </summary>
          <div class="day-body">
            ${day.character ? `<p class="day-character">${day.character}</p>` : ""}
            <div class="day-layout">
              <div class="activities">
                ${day.activities.map((activity) => `
                  <div class="act">
                    <div class="act-time">${activity.time}</div>
                    <div class="act-icon">${activity.icon}</div>
                    <div>
                      <div class="act-name">${activity.name}</div>
                      <div class="act-detail">${activity.detail}</div>
                      ${activity.note ? `<div class="tip-box">${activity.note}</div>` : ""}
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
            ${day.notes && day.notes.length ? `
              <aside class="tip-box day-focus-box day-focus-horizontal">
                <strong>Napi fókusz</strong>
                <ul class="plain-list compact focus-grid">
                  ${day.notes.map((note) => `<li>${note}</li>`).join("")}
                </ul>
              </aside>
            ` : ""}
            ${day.gpxPlaces && day.gpxPlaces.length ? `
              <section class="day-places">
                <h4 class="day-places-title">📍 GPX pontok, Google Maps és értékelések</h4>
                <div class="day-places-grid">
                  ${day.gpxPlaces.map((place) => `
                    <article class="day-place-card">
                      <div class="day-place-top">
                        <div>
                          <div class="day-place-name">${place.name}</div>
                          ${place.badge ? `<div class="day-place-badge">${place.badge}</div>` : ""}
                        </div>
                          ${place.googleRating ? `<div class="day-place-rating">⭐ ${place.googleRating}</div>` : ""}
                      </div>
                      ${place.duration ? `<div class="day-place-duration">⏳ ${place.duration}</div>` : ""}
                      <p class="day-place-detail">${place.detail}</p>
                      ${place.reviewNote ? `<p class="day-place-review">"${place.reviewNote}"</p>` : ""}
                      <div class="day-place-links">
                        ${place.maps ? `<a href="${place.maps}" target="_blank" rel="noreferrer">Google Maps</a>` : ""}
                        ${place.noteLink ? `<a href="${place.noteLink}" target="_blank" rel="noreferrer">${place.noteLabel || "Forrás"}</a>` : ""}
                      </div>
                    </article>
                  `).join("")}
                </div>
              </section>
            ` : ""}
            ${day.links && day.links.length ? `
              <section class="day-links-block">
                <h4 class="day-places-title">🔗 Napi linkek</h4>
                <div class="context-sources">
                  ${renderLinkList(day.links)}
                </div>
              </section>
            ` : ""}
          </div>
        </details>
      `;
    }

    function renderDetailedSection(sectionKey) {
      const section = tripData.sections[sectionKey];
      const forceClosed = sectionKey === "izland";
      const generalInfoBox = section.generalInfoBoxKey ? tripData[section.generalInfoBoxKey] : null;
      const topMap = section.mapAsset && section.mapAsset.image ? (forceClosed ? `
        <details class="card section-card map-card coll-card">
          <summary class="map-card-head">
            <div>
              <h3 class="info-title">${section.mapAsset.title}</h3>
              <p class="info-text">${section.mapAsset.text}</p>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px;">
              <div class="context-sources">${renderLinkList(section.mapAsset.links)}</div>
              <span class="collapse-icon" aria-hidden="true">▾</span>
            </div>
          </summary>
          <img class="section-map-image" src="${section.mapAsset.image}" alt="${section.mapAsset.title}">
        </details>
      ` : `
        <section class="card section-card map-card">
          <div class="map-card-head">
            <div>
              <h3 class="info-title">${section.mapAsset.title}</h3>
              <p class="info-text">${section.mapAsset.text}</p>
            </div>
            <div class="context-sources">${renderLinkList(section.mapAsset.links)}</div>
          </div>

    const PAGE_STATE_KEY = "izland-es-eszak-europa:view-state";
    const tabsMarkup = [
      renderOverview(),
      renderPersonView("tibi"),
      renderPersonView("henni"),
      renderDetailedSection("baltikum"),
      renderDetailedSection("izland"),
      renderDetailedSection("hazaut"),
      renderRestaurants(),
      renderPractical(),
      renderWeather(),
      renderMap(),
      renderInfo(),
      renderApps(),
      renderBudget()
    ].join("");

    function readPageState() {
      try {
        return JSON.parse(sessionStorage.getItem(PAGE_STATE_KEY) || "{}");
      } catch (_) {
        return {};
      }
    }

    function writePageState(nextState) {
      try {
        const prev = readPageState();
        sessionStorage.setItem(PAGE_STATE_KEY, JSON.stringify({ ...prev, ...nextState }));
      } catch (_) {}
    }

    function getInitialTabId() {
      const hashTab = (window.location.hash || "").replace(/^#/, "");
      if (tabs.some((tab) => tab.id === hashTab)) return hashTab;
      const savedTab = readPageState().activeTab;
      if (tabs.some((tab) => tab.id === savedTab)) return savedTab;
      return tabs[0].id;
    }

    views.innerHTML = tabsMarkup;

    const initialTabId = getInitialTabId();
    tabsEl.innerHTML = tabs.map((tab, index) => `
      <button class="tab-btn ${tab.id === initialTabId ? "is-active" : ""}" data-tab="${tab.id}">${tab.label}</button>
    `).join("");

    const tabButtons = Array.from(document.querySelectorAll(".tab-btn"));
    const viewEls = Array.from(document.querySelectorAll(".view"));
    let activeTabId = initialTabId;

    function activateTab(id) {
      activeTabId = id;
      tabButtons.forEach((button) => button.classList.toggle("is-active", button.dataset.tab === id));
      viewEls.forEach((view) => view.classList.toggle("is-active", view.dataset.view === id));
      writePageState({ activeTab: id });
      const nextHash = `#${id}`;
      if (window.location.hash !== nextHash) {
        history.replaceState(null, "", nextHash);
      }
    }

    window.activateTab = activateTab;
    activateTab(initialTabId);

    tabsEl.addEventListener("click", (event) => {
      const button = event.target.closest(".tab-btn");
      if (!button) return;
      activateTab(button.dataset.tab);
    });

    function saveScrollState() {
      writePageState({ activeTab: activeTabId, scrollY: window.scrollY });
    }

    window.addEventListener("scroll", saveScrollState, { passive: true });
    window.addEventListener("pagehide", saveScrollState);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") saveScrollState();
    });

    const savedScrollY = Number(readPageState().scrollY);
    if (Number.isFinite(savedScrollY) && savedScrollY > 0) {
      requestAnimationFrame(() => {
        window.scrollTo({ top: savedScrollY, left: 0, behavior: "auto" });
      });
    }

    // Leaflet invalidateSize when a collapsible map card is re-opened
    document.addEventListener("toggle", (e) => {
      if (!e.target.open || !window._leafletMaps) return;
      requestAnimationFrame(() => {
        for (const m of Object.values(window._leafletMaps)) {
          try { m.invalidateSize(); } catch(_) {}
        }
      });
    }, true);
  </script>
  <script type="module" src="./overview-map-init.js"></script>
  <script type="module" src="./section-map-init.js"></script>
</body>
</html>
